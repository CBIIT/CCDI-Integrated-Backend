        - sample_diagnosis_file_filters.sample_tumor_status
        - sample_diagnosis_file_filters.tumor_spatial_extent
        - sample_diagnosis_file_filters.diagnosis
        - sample_diagnosis_file_filters.diagnosis_category
        - sample_diagnosis_file_filters.diagnosis_anatomic_site
        - sample_diagnosis_file_filters.diagnosis_classification_system
        - sample_diagnosis_file_filters.diagnosis_basis
