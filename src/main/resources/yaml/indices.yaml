        - sample_diagnosis_file_filters.data_category
        - sample_diagnosis_file_filters.file_type
        - sample_diagnosis_file_filters.file_mapping_level
        - sample_diagnosis_file_filters.library_selection
        - sample_diagnosis_file_filters.library_source_material
        - sample_diagnosis_file_filters.library_source_molecule
        - sample_diagnosis_file_filters.library_strategy
      integer:
        - survival_filters.age_at_last_known_survival_status
        - treatment_filters.age_at_treatment_start
        - treatment_filters.age_at_treatment_end
        - treatment_response_filters.age_at_response
        - sample_diagnosis_file_filters.participant_age_at_collection
        - sample_diagnosis_file_filters.age_at_diagnosis
    # Cypher queries will be used to retrieve data from Neo4j, and index into Elasticsearch.
    # Uses the GC initial_query + update_queries pattern: initial_query seeds the index with
    # primary keys, then each update_query is applied independently and merged into the
    # corresponding OS document by `id`.
    initial_query:
      query: |
        MATCH (ga:genetic_analysis)
        WITH ga
        SKIP $skip LIMIT $limit
        RETURN ga.guid AS id
      page_size: 1000
    update_queries:
      - name: "genetic_analysis_properties"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit
          WITH ga,
               CASE WHEN ga.gene_symbol STARTS WITH '[' AND ga.gene_symbol ENDS WITH ']' THEN
                    [x IN split(replace(substring(ga.gene_symbol, 1, size(ga.gene_symbol)-2), "'", ""), ",") |
                CASE WHEN trim(x) = ''
                           THEN 'Not Reported'
                  ELSE trim(x) END
                    ]
                  ELSE
              [CASE WHEN trim(ga.gene_symbol) = ''
                          THEN 'Not Reported'
                 ELSE trim(ga.gene_symbol) END]
                END AS gene_symbol_arr
          UNWIND gene_symbol_arr AS gene
          WITH ga, collect(DISTINCT gene) AS gene_symbol
          RETURN
            ga.guid AS id,
            ga.genetic_analysis_id AS genetic_analysis_id,
            ga.alteration AS alteration,
            ga.cytoband AS cytoband,
            gene_symbol AS gene_symbol,
            CASE
              WHEN size(gene_symbol) = 0 THEN null
              ELSE reduce(s = '', item IN gene_symbol |
                CASE WHEN s = '' THEN item ELSE s + ';' + item END)
            END AS gene_symbol_str,
            ga.genomic_source_category AS genomic_source_category,
            ga.hgvs_coding AS hgvs_coding,
            ga.hgvs_genome AS hgvs_genome,
            ga.hgvs_protein AS hgvs_protein,
            ga.reported_significance AS reported_significance,
            ga.reported_significance_system AS reported_significance_system,
            ga.status AS status,
            ga.test AS test,
            ga.alteration_effect AS alteration_effect,
            ga.alteration_type AS alteration_type,
            ga.chromosome AS chromosome,
            ga.exon AS exon,
            ga.fusion_partner_exon AS fusion_partner_exon,
            ga.fusion_partner_gene AS fusion_partner_gene,
            ga.reference_genome AS reference_genome
        page_size: 1000
      - name: "participant_properties"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (ga)-[*..4]->(p:participant)
          RETURN
            ga.guid AS id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            p.sex_at_birth AS sex_at_birth
        page_size: 1000
      - name: "study_properties"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (ga)-[*..7]->(st:study)
          RETURN
            ga.guid AS id,
            st.study_id AS study_id,
            st.dbgap_accession AS dbgap_accession,
            st.study_phase AS study_phase,
            st.study_acronym AS study_acronym,
            st.study_name AS study_name
        page_size: 1000
      - name: "survival_filters"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (ga)-[*..4]->(:participant)<-[:of_survival]-(su:survival)
          WITH
            ga.guid AS id,
            count(su) AS su_count,
            [item IN collect(DISTINCT {
              last_known_survival_status: su.last_known_survival_status,
              cause_of_death: su.cause_of_death,
              first_event: su.first_event,
              age_at_last_known_survival_status: su.age_at_last_known_survival_status
            }) WHERE item.last_known_survival_status IS NOT NULL OR item.cause_of_death IS NOT NULL OR item.first_event IS NOT NULL OR item.age_at_last_known_survival_status IS NOT NULL] AS survival_filters
          WITH id, CASE WHEN su_count > 0 THEN survival_filters ELSE [] END AS survival_filters
          RETURN id, survival_filters
        page_size: 1000
      - name: "treatment_filters"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit

          OPTIONAL MATCH (ga)-[*..4]->(p:participant)

          OPTIONAL MATCH (p)<-[:of_treatment_chemotherapy]-(tchemo:treatment_chemotherapy)
          WITH ga, p, COLLECT(DISTINCT {
            treatment_type: tchemo.chemotherapy_type,
            treatment_agent: tchemo.chemotherapy_agent,
            age_at_treatment_start: tchemo.age_at_treatment_start,
            age_at_treatment_end: tchemo.age_at_treatment_end
          }) AS chemo_filters

          OPTIONAL MATCH (p)<-[:of_treatment_radiation]-(trad:treatment_radiation)
          WITH ga, p, chemo_filters, COLLECT(DISTINCT {
            treatment_type: trad.treatment_type,
            treatment_agent: trad.radiation_therapy_type,
            age_at_treatment_start: trad.age_at_treatment_start,
            age_at_treatment_end: trad.age_at_treatment_end
          }) AS radiation_filters

          OPTIONAL MATCH (p)<-[:of_treatment_surgery]-(tsurg:treatment_surgery)
          WITH ga, p, chemo_filters, radiation_filters, COLLECT(DISTINCT {
            treatment_type: tsurg.treatment_type,
            treatment_agent: tsurg.surgery_type,
            age_at_treatment_start: tsurg.age_at_treatment_start,
            age_at_treatment_end: tsurg.age_at_treatment_end
          }) AS surgery_filters

          OPTIONAL MATCH (p)<-[:of_treatment_other]-(toth:treatment_other)
          WITH ga,
              chemo_filters + radiation_filters + surgery_filters + COLLECT(DISTINCT {
                treatment_type: toth.treatment_type,
                treatment_agent: toth.other_treatment_type,
                age_at_treatment_start: toth.age_at_treatment_start,
                age_at_treatment_end: toth.age_at_treatment_end
              }) AS raw_treatment_filters

          UNWIND raw_treatment_filters AS f

          WITH ga, COLLECT(DISTINCT f) AS deduped_treatment_filters

          WITH ga.guid AS id,
              [
                f IN deduped_treatment_filters
                WHERE f.treatment_type IS NOT NULL
                    OR f.treatment_agent IS NOT NULL
                    OR f.age_at_treatment_start IS NOT NULL
                    OR f.age_at_treatment_end IS NOT NULL
              ] AS treatment_filters

          RETURN id, treatment_filters
        page_size: 1000
      - name: "treatment_response_filters"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (ga)-[*..4]->(:participant)<-[:of_treatment_response]-(tresp:treatment_response)
          WITH
            ga.guid AS id,
            count(tresp) AS tresp_count,
            [item IN collect(DISTINCT {
              age_at_response: tresp.age_at_response,
              response: tresp.response,
              response_category: tresp.response_category,
              response_system: tresp.response_system
            }) WHERE item.response IS NOT NULL OR item.age_at_response IS NOT NULL OR item.response_category IS NOT NULL OR item.response_system IS NOT NULL] AS treatment_response_filters
          WITH id, CASE WHEN tresp_count > 0 THEN treatment_response_filters ELSE [] END AS treatment_response_filters
          RETURN id, treatment_response_filters
        page_size: 1000
      - name: "sample_diagnosis_file_filters"
        query: |
          MATCH (ga:genetic_analysis)
          WITH ga
          SKIP $skip LIMIT $limit

          CALL {
            WITH ga

            // Case 1: ga -> sample_1 -> participant
            // Also include related sample_2 -> model -> sample_1 contexts
            OPTIONAL MATCH (ga)-->(s1:sample)-->(p1:participant)

            WITH ga, s1, p1,
                collect(DISTINCT {sm: s1, source_sm: s1, p: p1}) AS direct_contexts

            OPTIONAL MATCH (s2:sample)-->(model)-->(s1)
            WHERE model:cell_line OR model:pdx

            WITH direct_contexts
              + collect(DISTINCT {sm: s1, source_sm: s2, p: p1})
              + collect(DISTINCT {sm: s2, source_sm: s2, p: p1})
              + collect(DISTINCT {sm: s2, source_sm: s1, p: p1}) AS contexts

            UNWIND contexts AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p

            UNION

            WITH ga

            // Case 2: ga -> sample_2 -> model -> sample_1 -> participant
            OPTIONAL MATCH (ga)-->(s2:sample)-->(model)-->(s1:sample)-->(p2:participant)
            WHERE model:cell_line OR model:pdx

            WITH s1, s2, p2
            UNWIND [
              {sm: s1, source_sm: s1, p: p2},
              {sm: s1, source_sm: s2, p: p2},
              {sm: s2, source_sm: s2, p: p2},
              {sm: s2, source_sm: s1, p: p2}
            ] AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p

            UNION

            WITH ga

            // Case 3: ga -> sample -> model -> study
            OPTIONAL MATCH (ga)-->(s3:sample)-->(model)-->(st:study)
            WHERE model:cell_line OR model:pdx

            RETURN s3 AS sm, s3 AS source_sm, null AS p

            UNION

            WITH ga

            // Case 4: ga -> participant, then expand all sample contexts under participant
            OPTIONAL MATCH (ga)-->(p4:participant)

            OPTIONAL MATCH (p4)<--(direct_sm:sample)
            WITH ga, p4,
                collect(DISTINCT {sm: direct_sm, source_sm: direct_sm, p: p4}) AS direct_contexts

            OPTIONAL MATCH (p4)<-[:of_sample]-(s1_model:sample)<--(model)<--(s2_model:sample)
            WHERE model:cell_line OR model:pdx

            WITH direct_contexts
              + collect(DISTINCT {sm: s1_model, source_sm: s1_model, p: p4})
              + collect(DISTINCT {sm: s1_model, source_sm: s2_model, p: p4})
              + collect(DISTINCT {sm: s2_model, source_sm: s2_model, p: p4})
              + collect(DISTINCT {sm: s2_model, source_sm: s1_model, p: p4}) AS contexts

            UNWIND contexts AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p
          }

          WITH ga, sm, source_sm, p
          WHERE sm IS NOT NULL OR p IS NOT NULL

          // Sample-level files
          OPTIONAL MATCH (source_sm)<--(sample_file)
          WHERE sample_file:sequencing_file
            OR sample_file:generic_file
            OR sample_file:methylation_array_file
            OR sample_file:pathology_file
            OR sample_file:cytogenomic_file

          WITH ga, sm, source_sm, p,
              collect(DISTINCT sample_file) AS sample_files

          // Participant-level files
          OPTIONAL MATCH (p)<--(participant_file)
          WHERE participant_file:clinical_measure_file
            OR participant_file:generic_file
            OR participant_file:radiology_file

          WITH ga, sm, source_sm, p,
              sample_files,
              collect(DISTINCT participant_file) AS participant_files

          // Sample-level diagnosis
          OPTIONAL MATCH (source_sm)<--(sample_dg:diagnosis)

          WITH ga, sm, p,
              sample_files,
              participant_files,
              collect(DISTINCT sample_dg) AS sample_diagnoses

          // Participant-level diagnosis
          OPTIONAL MATCH (p)<--(participant_dg:diagnosis)

          WITH ga, sm,
              sample_files + participant_files AS files,
              sample_diagnoses + collect(DISTINCT participant_dg) AS diagnoses

          UNWIND CASE WHEN size(files) = 0 THEN [null] ELSE files END AS file
          UNWIND CASE WHEN size(diagnoses) = 0 THEN [null] ELSE diagnoses END AS dg

          WITH DISTINCT
            ga.guid AS id,

            sm.anatomic_site AS sample_anatomic_site,
            sm.participant_age_at_collection AS participant_age_at_collection,
            sm.sample_tumor_status AS sample_tumor_status,
            sm.tumor_spatial_extent AS tumor_spatial_extent,

            dg.age_at_diagnosis AS age_at_diagnosis,
            dg.anatomic_site AS diagnosis_anatomic_site,
            dg.disease_phase AS disease_phase,
            dg.diagnosis_classification_system AS diagnosis_classification_system,
            dg.diagnosis_category AS diagnosis_category,
            dg.diagnosis_basis AS diagnosis_basis,
            dg.diagnosis AS diagnosis,

            file.data_category AS data_category,
            file.file_type AS file_type,
            file.file_mapping_level AS file_mapping_level,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_selection ELSE null END AS library_selection,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_source_material ELSE null END AS library_source_material,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_source_molecule ELSE null END AS library_source_molecule,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_strategy ELSE null END AS library_strategy

          WITH id,
              collect(DISTINCT {
                sample_anatomic_site: sample_anatomic_site,
                participant_age_at_collection: participant_age_at_collection,
                sample_tumor_status: sample_tumor_status,
                tumor_spatial_extent: tumor_spatial_extent,

                age_at_diagnosis: age_at_diagnosis,
                diagnosis_anatomic_site: diagnosis_anatomic_site,
                disease_phase: disease_phase,
                diagnosis_classification_system: diagnosis_classification_system,
                diagnosis_category: diagnosis_category,
                diagnosis_basis: diagnosis_basis,
                diagnosis: diagnosis,

                data_category: data_category,
                file_type: file_type,
                file_mapping_level: file_mapping_level,
                library_selection: library_selection,
                library_source_material: library_source_material,
                library_source_molecule: library_source_molecule,
                library_strategy: library_strategy
              }) AS raw_filters

          RETURN
            id,
            [
              f IN raw_filters
              WHERE f.sample_anatomic_site IS NOT NULL
                OR f.participant_age_at_collection IS NOT NULL
                OR f.sample_tumor_status IS NOT NULL
                OR f.tumor_spatial_extent IS NOT NULL
                OR f.diagnosis IS NOT NULL
                OR f.age_at_diagnosis IS NOT NULL
                OR f.file_type IS NOT NULL
            ] AS sample_diagnosis_file_filters
        page_size: 500

  - index_name: studies_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - study_id
        - grant_id
        - pubmed_ids
        - dbgap_accession
        - study_phase
        - study_name
        - study_description
        - study_acronym
        - PIs
        - consent_codes
      integer:
        - num_of_diagnoses
        - num_of_participants
        - num_of_samples
        - num_of_files
        - num_of_study_files
        - num_of_participant_files
        - num_of_sample_files
        - num_of_publications
      text:
        - diagnosis_cancer
        - diagnosis_anatomic_site
        - file_types
        - files
    # Cypher queries will be used to retrieve data from Neo4j, and index into Elasticsearch.
    # Uses the GC initial_query + update_queries pattern: initial_query seeds the index with
    # primary keys, then each update_query is applied independently and merged into the
    # corresponding OS document by `id`.
    initial_query:
      query: |
        MATCH (st:study)
        WITH st
        SKIP $skip LIMIT $limit
        RETURN st.guid AS id
      page_size: 1000
    update_queries:
      - name: "study_properties"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          RETURN
            st.guid AS id,
            st.study_id AS study_id,
            st.dbgap_accession AS dbgap_accession,
            st.study_phase AS study_phase,
            st.study_name AS study_name,
            st.study_description AS study_description,
            st.study_acronym AS study_acronym
        page_size: 1000
      - name: "study_funding"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[:of_study_funding]-(stf:study_funding)
          WITH
            st,
            [g IN COLLECT(DISTINCT stf.grant_id) WHERE g IS NOT NULL] AS grant_ids
          RETURN
            st.guid AS id,
            reduce(
              s = '',
              g IN grant_ids |
                CASE
                  WHEN s = '' THEN g
                  ELSE s + ';' + g
                END
            ) AS grant_id
        page_size: 1000
      - name: "study_personnel"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[:of_study_personnel]-(stp:study_personnel)
          WHERE stp.personnel_type = 'PI'
          WITH
            st,
            [n IN COLLECT(DISTINCT stp.personnel_name) WHERE n IS NOT NULL] AS pis
          RETURN
            st.guid AS id,
            reduce(
              s = '',
              n IN pis |
                CASE
                  WHEN s = '' THEN n
                  ELSE s + ';' + n
                END
            ) AS PIs
        page_size: 1000
      - name: "study_publications"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[:of_publication]-(pub:publication)
          WITH st, [pid IN COLLECT(DISTINCT pub.pubmed_id) WHERE pid IS NOT NULL] AS pub_ids
          RETURN
            st.guid AS id,
            reduce(
              s = '',
              pid IN pub_ids |
                CASE
                  WHEN s = '' THEN pid
                  ELSE s + ';' + pid
                END
            ) AS pubmed_ids,
            size(pub_ids) AS num_of_publications
        page_size: 1000
      - name: "consent_codes"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[:of_consent_group]-(cg:consent_group)
          WITH
            st,
            [code IN COLLECT(DISTINCT cg.consent_group_name) WHERE code IS NOT NULL] AS consent_codes
          RETURN
            st.guid AS id,
            consent_codes AS consent_codes
        page_size: 1000
      - name: "num_of_participants"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[:of_consent_group]-(:consent_group)<-[:of_participant]-(p:participant)
          RETURN
            st.guid AS id,
            COUNT(DISTINCT p) AS num_of_participants
        page_size: 1000
      - name: "num_of_samples"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          // direct-from-participant samples + cell_line/pdx-derived samples
          OPTIONAL MATCH (st)<-[*..2]-(pcp)<-[:of_sample]-(sm1:sample)
          WHERE (pcp:participant OR pcp:cell_line OR pcp:pdx)
          WITH st, COUNT(DISTINCT sm1.sample_id) AS num_samples_1
          OPTIONAL MATCH
            (st)<-[:of_consent_group]-(:consent_group)<-[:of_participant]-(:participant)<-[:of_sample]-(:sample)<--(cp)<--(sm2:sample)
          WHERE (cp:cell_line OR cp:pdx)
          WITH st, num_samples_1, COUNT(DISTINCT sm2.sample_id) AS num_samples_2
          RETURN
            st.guid AS id,
            num_samples_1 + num_samples_2 AS num_of_samples
        page_size: 1000
      - name: "diagnosis_aggregations"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[*..6]-(dg:diagnosis)
          WITH st, COUNT(DISTINCT dg.diagnosis) AS num_diag
          OPTIONAL MATCH (st)<-[*..6]-(dg:diagnosis)
          WITH st, num_diag, dg.diagnosis AS dg_cancer, COUNT(dg.diagnosis) AS num_cancers
          ORDER BY num_cancers DESC
          WITH st, num_diag, COLLECT(dg_cancer + ' (' + toString(num_cancers) + ')') AS cancers
          OPTIONAL MATCH (st)<-[*..6]-(diag:diagnosis)
          WITH st, num_diag, cancers, coalesce(diag.anatomic_site, []) AS dg_sites
          UNWIND dg_sites AS dg_site
          WITH st, num_diag, cancers, dg_site, COUNT(dg_site) AS num_sites
          ORDER BY num_sites DESC
          WITH st, num_diag, cancers, COLLECT(dg_site + ' (' + toString(num_sites) + ')') AS sites
          RETURN
            st.guid AS id,
            num_diag AS num_of_diagnoses,
            cancers AS diagnosis_cancer,
            sites AS diagnosis_anatomic_site
        page_size: 1000
      - name: "file_aggregations"
        query: |
          MATCH (st:study)
          WITH st
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (st)<-[*..6]-(fl)
          WHERE (fl:clinical_measure_file OR fl:generic_file OR fl:sequencing_file OR fl:pathology_file OR fl:radiology_file OR fl:methylation_array_file OR fl:cytogenomic_file)
          WITH st,
               fl.file_type AS ft,
               COUNT(DISTINCT fl.dcf_indexd_guid) AS num_ft
          ORDER BY num_ft DESC
          WITH st,
               COLLECT(ft + ' (' + toString(num_ft) + ')') AS file_types
          OPTIONAL MATCH (st)<-[*..6]-(file)
          WHERE (file:clinical_measure_file OR file:generic_file OR file:sequencing_file OR file:pathology_file OR file:radiology_file OR file:methylation_array_file OR file:cytogenomic_file)
          WITH st, file_types,
               file.dcf_indexd_guid AS file_id,
               file.file_mapping_level AS file_level
          WITH st, file_types,
               COLLECT(DISTINCT file_id) AS all_file_ids,
               COUNT(DISTINCT CASE WHEN file_level = 'Study'       THEN file_id END) AS num_study_files,
               COUNT(DISTINCT CASE WHEN file_level = 'Participant' THEN file_id END) AS num_participant_files,
               COUNT(DISTINCT CASE WHEN file_level = 'Sample'      THEN file_id END) AS num_sample_files
          RETURN
            st.guid AS id,
            file_types AS file_types,
            num_study_files + num_participant_files + num_sample_files AS num_of_files,
            all_file_ids AS files,
            num_study_files       AS num_of_study_files,
            num_participant_files AS num_of_participant_files,
            num_sample_files      AS num_of_sample_files
        page_size: 1
  
  - index_name: samples_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - sample_id
        - pid
        - participant_id
        - race
        - sex_at_birth
        - study_id
        - dbgap_accession
        - study_phase
        - study_acronym
        - study_name
        - sample_anatomic_site
        - sample_anatomic_site_str
        - sample_tumor_status
        - tumor_spatial_extent
        - laterality
        - sample_description
        - pdx_id
        - cell_line_id
        - diagnosis_filters.diagnosis_anatomic_site
        - diagnosis_filters.disease_phase
        - diagnosis_filters.diagnosis_classification_system
        - diagnosis_filters.diagnosis_basis
        - diagnosis_filters.diagnosis
        - diagnosis_filters.diagnosis_category
        - genetic_analysis_filters.reported_significance
        - genetic_analysis_filters.reported_significance_system
        - genetic_analysis_filters.gene_symbol
        - genetic_analysis_filters.alteration
        - genetic_analysis_filters.fusion_partner_gene
        - genetic_analysis_filters.alteration_type
        - genetic_analysis_filters.status
        - file_filters.data_category
        - file_filters.file_type
        - file_filters.file_mapping_level
        - file_filters.library_selection
        - file_filters.library_source_material
        - file_filters.library_source_molecule
        - file_filters.library_strategy
        - survival_filters.last_known_survival_status
        - survival_filters.cause_of_death
        - survival_filters.first_event
        - treatment_filters.treatment_type
        - treatment_filters.treatment_agent
        - treatment_response_filters.response
        - treatment_response_filters.response_category
        - treatment_response_filters.response_system
        - files
      integer:
        - participant_age_at_collection
        - diagnosis_filters.age_at_diagnosis
        - survival_filters.age_at_last_known_survival_status
        - treatment_filters.age_at_treatment_start
        - treatment_filters.age_at_treatment_end
        - treatment_response_filters.age_at_response
        - file_count
        - direct_file_count
      float:
        - percent_tumor
        - percent_necrosis
    # Cypher queries will be used to retrieve data from Neo4j, and index into Elasticsearch.
    # Uses the GC initial_query + update_queries pattern: initial_query seeds the index with
    # primary keys, then each update_query is applied independently and merged into the
    # corresponding OS document by `id`.
    initial_query:
      query: |
        MATCH (sm:sample)
        WITH sm
        SKIP $skip LIMIT $limit
        RETURN sm.guid AS id
      page_size: 1000
    update_queries:
      - name: "sample_properties"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          RETURN
            sm.guid AS id,
            sm.sample_id AS sample_id,
            sm.anatomic_site AS sample_anatomic_site,
            reduce(
              s = '',
              site IN coalesce(sm.anatomic_site, []) |
                CASE
                  WHEN s = '' THEN site
                  ELSE s + ';' + site
                END
            ) AS sample_anatomic_site_str,
            sm.participant_age_at_collection AS participant_age_at_collection,
            sm.sample_tumor_status AS sample_tumor_status,
            sm.tumor_spatial_extent AS tumor_spatial_extent,
            sm.laterality AS laterality,
            sm.sample_description AS sample_description,
            sm.percent_tumor AS percent_tumor,
            sm.percent_necrosis AS percent_necrosis
        page_size: 1000
      - name: "cell_line_ids"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[:of_sample]->(out_cell:cell_line)
          WITH sm, collect(DISTINCT out_cell.cell_line_id) AS outgoing_cell_line_ids
          OPTIONAL MATCH (sm)<-[:of_cell_line]-(in_cell:cell_line)
          WITH
            sm,
            outgoing_cell_line_ids,
            collect(DISTINCT in_cell.cell_line_id) AS incoming_cell_line_ids
          RETURN
            sm.guid AS id,
            reduce(
              cell_line_ids = [],
              cell_line_id IN outgoing_cell_line_ids + incoming_cell_line_ids |
                CASE
                  WHEN cell_line_id IS NULL OR cell_line_id IN cell_line_ids THEN cell_line_ids
                  ELSE cell_line_ids + [cell_line_id]
                END
            ) AS cell_line_id
        page_size: 1000
      - name: "pdx_ids"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[:of_sample]->(out_pdx:pdx)
          WITH sm, collect(DISTINCT out_pdx.pdx_id) AS outgoing_pdx_ids
          OPTIONAL MATCH (sm)<-[:of_pdx]-(in_pdx:pdx)
          WITH
            sm,
            outgoing_pdx_ids,
            collect(DISTINCT in_pdx.pdx_id) AS incoming_pdx_ids
          RETURN
            sm.guid AS id,
            reduce(
              pdx_ids = [],
              pdx_id IN outgoing_pdx_ids + incoming_pdx_ids |
                CASE
                  WHEN pdx_id IS NULL OR pdx_id IN pdx_ids THEN pdx_ids
                  ELSE pdx_ids + [pdx_id]
                END
            ) AS pdx_id
        page_size: 1000
      - name: "participant_properties"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[*..3]->(p:participant)
          RETURN
            sm.guid AS id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            p.sex_at_birth AS sex_at_birth
        page_size: 1000
      - name: "study_properties"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          // study reachable via participant->consent_group OR via cell_line/pdx
          OPTIONAL MATCH (sm)-[*..5]->(st:study)
          WITH sm, st
          RETURN
            sm.guid AS id,
            st.study_id AS study_id,
            st.dbgap_accession AS dbgap_accession,
            st.study_phase AS study_phase,
            st.study_acronym AS study_acronym,
            st.study_name AS study_name
        page_size: 1000
      - name: "diagnosis_filters"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[*..3]->(:participant)<--(dg1:diagnosis)
          WITH sm, COLLECT(DISTINCT {
            age_at_diagnosis: dg1.age_at_diagnosis,
            diagnosis_anatomic_site: dg1.anatomic_site,
            disease_phase: dg1.disease_phase,
            diagnosis_classification_system: dg1.diagnosis_classification_system,
            diagnosis_category: dg1.diagnosis_category,
            diagnosis_basis: dg1.diagnosis_basis,
            diagnosis: dg1.diagnosis
          }) AS dg1_filters
          OPTIONAL MATCH (sm)<-[*..3]-(dg2:diagnosis)
          WITH sm, dg1_filters, COLLECT(DISTINCT {
            age_at_diagnosis: dg2.age_at_diagnosis,
            diagnosis_anatomic_site: dg2.anatomic_site,
            disease_phase: dg2.disease_phase,
            diagnosis_classification_system: dg2.diagnosis_classification_system,
            diagnosis_category: dg2.diagnosis_category,
            diagnosis_basis: dg2.diagnosis_basis,
            diagnosis: dg2.diagnosis
          }) AS dg2_filters
          WITH sm, dg1_filters + dg2_filters AS all_diag_filters
          UNWIND CASE WHEN size(all_diag_filters) = 0 THEN [NULL] ELSE all_diag_filters END AS f
          WITH sm, COLLECT(DISTINCT f) AS raw_diag_filters
          WITH sm,
               [f IN raw_diag_filters WHERE f IS NOT NULL AND (f.diagnosis IS NOT NULL OR f.age_at_diagnosis IS NOT NULL)] AS diagnosis_filters
          RETURN
            sm.guid AS id,
            diagnosis_filters AS diagnosis_filters
        page_size: 1000
      - name: "genetic_analysis_filters"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[*..3]->(:participant)<--(ga1:genetic_analysis)
          WITH sm, COLLECT(DISTINCT {
            reported_significance: ga1.reported_significance,
            reported_significance_system: ga1.reported_significance_system,
            gene_symbol: ga1.gene_symbol,
            alteration: ga1.alteration,
            fusion_partner_gene: ga1.fusion_partner_gene,
            alteration_type: ga1.alteration_type,
            status: ga1.status
          }) AS ga1_filters
          OPTIONAL MATCH (sm)<-[*..3]-(ga2:genetic_analysis)
          WITH sm, ga1_filters, COLLECT(DISTINCT {
            reported_significance: ga2.reported_significance,
            reported_significance_system: ga2.reported_significance_system,
            gene_symbol: ga2.gene_symbol,
            alteration: ga2.alteration,
            fusion_partner_gene: ga2.fusion_partner_gene,
            alteration_type: ga2.alteration_type,
            status: ga2.status
          }) AS ga2_filters
          WITH sm, ga1_filters + ga2_filters AS all_ga_filters
          UNWIND CASE WHEN size(all_ga_filters) = 0 THEN [NULL] ELSE all_ga_filters END AS f
          WITH sm, COLLECT(DISTINCT f) AS raw_ga_filters
          WITH sm,
               [f IN raw_ga_filters WHERE f IS NOT NULL AND (f.alteration IS NOT NULL OR f.gene_symbol IS NOT NULL OR f.alteration_type IS NOT NULL OR f.status IS NOT NULL OR f.reported_significance IS NOT NULL)] AS genetic_analysis_filters
          RETURN
            sm.guid AS id,
            genetic_analysis_filters AS genetic_analysis_filters
        page_size: 1000
      - name: "file_filters_and_files"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          // Participant-level files (clinical_measure / generic / radiology)
          OPTIONAL MATCH (sm)-[*..3]->(:participant)<--(pfile)
          WHERE (pfile:clinical_measure_file OR pfile:generic_file OR pfile:radiology_file)
          WITH sm, COLLECT(DISTINCT {
            data_category: pfile.data_category,
            file_type: pfile.file_type,
            file_mapping_level: pfile.file_mapping_level,
            library_selection: null,
            library_source_material: null,
            library_source_molecule: null,
            library_strategy: null
          }) AS f_participant_part
          // Sample-level files (sequencing_file / generic / pathology / cytogenomic / methylation_array)
          OPTIONAL MATCH (sm)<-[*..3]-(sfile)
          WHERE (sfile:sequencing_file OR sfile:generic_file OR sfile:pathology_file OR sfile:cytogenomic_file OR sfile:methylation_array_file)
          WITH sm, f_participant_part, COLLECT(DISTINCT {
            data_category: sfile.data_category,
            file_type: sfile.file_type,
            file_mapping_level: sfile.file_mapping_level,
            library_selection: sfile.library_selection,
            library_source_material: sfile.library_source_material,
            library_source_molecule: sfile.library_source_molecule,
            library_strategy: sfile.library_strategy
          }) AS f_sample_part
          // Sample-level files (sequencing_file / generic / pathology / cytogenomic / methylation_array)
          OPTIONAL MATCH (sm)-->(model)-->(sm1:sample)
          WHERE model:cell_line OR model:pdx
          OPTIONAL MATCH (sm1)<--(parent_sfile)
          WHERE (parent_sfile:sequencing_file OR parent_sfile:generic_file OR parent_sfile:pathology_file OR parent_sfile:cytogenomic_file OR parent_sfile:methylation_array_file)
          WITH sm, f_participant_part, f_sample_part, COLLECT(DISTINCT {
            data_category: parent_sfile.data_category,
            file_type: parent_sfile.file_type,
            file_mapping_level: parent_sfile.file_mapping_level,
            library_selection: parent_sfile.library_selection,
            library_source_material: parent_sfile.library_source_material,
            library_source_molecule: parent_sfile.library_source_molecule,
            library_strategy: parent_sfile.library_strategy
          }) AS f_sample_part_additional
          WITH sm,
               f_participant_part + f_sample_part + f_sample_part_additional AS all_file_filters
          UNWIND CASE WHEN size(all_file_filters) = 0 THEN [NULL] ELSE all_file_filters END AS f
          WITH sm, COLLECT(DISTINCT f) AS raw_file_filters
          WITH sm,
               [f IN raw_file_filters WHERE f IS NOT NULL AND f.file_type IS NOT NULL] AS file_filters
          WITH sm, file_filters
          RETURN
            sm.guid AS id,
            file_filters AS file_filters,
            [] AS files, // Not used in the current implementation
            0 AS file_count, // Not used in the current implementation
            0 AS direct_file_count
        page_size: 1000
      - name: "survival_filters"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[*..3]->(:participant)<-[:of_survival]-(su:survival)
          WITH
            sm.guid AS id,
            count(su) AS su_count,
            [item IN collect(DISTINCT {
              last_known_survival_status: su.last_known_survival_status,
              cause_of_death: su.cause_of_death,
              first_event: su.first_event,
              age_at_last_known_survival_status: su.age_at_last_known_survival_status
            }) WHERE item.last_known_survival_status IS NOT NULL OR item.cause_of_death IS NOT NULL OR item.first_event IS NOT NULL OR item.age_at_last_known_survival_status IS NOT NULL] AS survival_filters
          WITH
            id,
            CASE WHEN su_count > 0 THEN survival_filters ELSE [] END AS survival_filters
          RETURN id, survival_filters
        page_size: 1000
      - name: "treatment_filters"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip
          LIMIT $limit

          OPTIONAL MATCH (sm)-[*..3]->(p:participant)

          OPTIONAL MATCH (p)<-[:of_treatment_chemotherapy]-(tchemo:treatment_chemotherapy)
          WITH sm, p, COLLECT(DISTINCT {
            treatment_type: tchemo.chemotherapy_type,
            treatment_agent: tchemo.chemotherapy_agent,
            age_at_treatment_start: tchemo.age_at_treatment_start,
            age_at_treatment_end: tchemo.age_at_treatment_end
          }) AS chemo_filters

          OPTIONAL MATCH (p)<-[:of_treatment_radiation]-(trad:treatment_radiation)
          WITH sm, p, chemo_filters, COLLECT(DISTINCT {
            treatment_type: trad.treatment_type,
            treatment_agent: trad.radiation_therapy_type,
            age_at_treatment_start: trad.age_at_treatment_start,
            age_at_treatment_end: trad.age_at_treatment_end
          }) AS radiation_filters

          OPTIONAL MATCH (p)<-[:of_treatment_surgery]-(tsurg:treatment_surgery)
          WITH sm, p, chemo_filters, radiation_filters, COLLECT(DISTINCT {
            treatment_type: tsurg.treatment_type,
            treatment_agent: tsurg.surgery_type,
            age_at_treatment_start: tsurg.age_at_treatment_start,
            age_at_treatment_end: tsurg.age_at_treatment_end
          }) AS surgery_filters

          OPTIONAL MATCH (p)<-[:of_treatment_other]-(toth:treatment_other)
          WITH sm,
              chemo_filters + radiation_filters + surgery_filters + COLLECT(DISTINCT {
                treatment_type: toth.treatment_type,
                treatment_agent: toth.other_treatment_type,
                age_at_treatment_start: toth.age_at_treatment_start,
                age_at_treatment_end: toth.age_at_treatment_end
              }) AS raw_treatment_filters

          UNWIND raw_treatment_filters AS f

          WITH sm, COLLECT(DISTINCT f) AS deduped_treatment_filters

          WITH sm.guid AS id,
              [
                f IN deduped_treatment_filters
                WHERE f.treatment_type IS NOT NULL
                    OR f.treatment_agent IS NOT NULL
                    OR f.age_at_treatment_start IS NOT NULL
                    OR f.age_at_treatment_end IS NOT NULL
              ] AS treatment_filters

          RETURN id, treatment_filters
        page_size: 1000
      - name: "treatment_response_filters"
        query: |
          MATCH (sm:sample)
          WITH sm
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sm)-[*..3]->(:participant)<-[:of_treatment_response]-(tresp:treatment_response)
          WITH
            sm.guid AS id,
            count(tresp) AS tresp_count,
            [item IN collect(DISTINCT {
              age_at_response: tresp.age_at_response,
              response: tresp.response,
              response_category: tresp.response_category,
              response_system: tresp.response_system
            }) WHERE item.response IS NOT NULL OR item.age_at_response IS NOT NULL OR item.response_category IS NOT NULL OR item.response_system IS NOT NULL] AS treatment_response_filters
          WITH
            id,
            CASE WHEN tresp_count > 0 THEN treatment_response_filters ELSE [] END AS treatment_response_filters
          RETURN id, treatment_response_filters
        page_size: 1000

  - index_name: files_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - file_id
        - pid
        - participant_id
        - sample_id
        - study_id
        - dbgap_accession
        - study_phase
        - study_acronym
        - study_name
        - anatomic_site
        - sample_tumor_status
        - tumor_spatial_extent
        - sample_description
        - file_name
        - data_category
        - file_type
        - file_description
        - consent_codes
        - md5sum
        - file_mapping_level
        - file_access
        - library_selection
        - library_strategy
        - library_source_material
        - library_source_molecule
        - fixation_embedding_method
        - staining_method
        - combined_filters.participant_id
        - combined_filters.race
        - combined_filters.sex_at_birth
        - combined_filters.survival_filters.last_known_survival_status
        - combined_filters.survival_filters.cause_of_death
        - combined_filters.survival_filters.first_event
        - combined_filters.treatment_filters.treatment_type
        - combined_filters.treatment_filters.treatment_agent
        - combined_filters.treatment_response_filters.response
        - combined_filters.treatment_response_filters.response_category
        - combined_filters.treatment_response_filters.response_system
        - combined_filters.sample_diagnosis_genetic_analysis_filters.sample_anatomic_site
        - combined_filters.sample_diagnosis_genetic_analysis_filters.sample_tumor_status
        - combined_filters.sample_diagnosis_genetic_analysis_filters.tumor_spatial_extent
        - combined_filters.sample_diagnosis_genetic_analysis_filters.diagnosis_anatomic_site
        - combined_filters.sample_diagnosis_genetic_analysis_filters.disease_phase
        - combined_filters.sample_diagnosis_genetic_analysis_filters.diagnosis_classification_system
        - combined_filters.sample_diagnosis_genetic_analysis_filters.diagnosis_basis
        - combined_filters.sample_diagnosis_genetic_analysis_filters.diagnosis
        - combined_filters.sample_diagnosis_genetic_analysis_filters.diagnosis_category
        - combined_filters.sample_diagnosis_genetic_analysis_filters.reported_significance
        - combined_filters.sample_diagnosis_genetic_analysis_filters.reported_significance_system
        - combined_filters.sample_diagnosis_genetic_analysis_filters.gene_symbol
        - combined_filters.sample_diagnosis_genetic_analysis_filters.alteration
        - combined_filters.sample_diagnosis_genetic_analysis_filters.fusion_partner_gene
        - combined_filters.sample_diagnosis_genetic_analysis_filters.alteration_type
        - combined_filters.sample_diagnosis_genetic_analysis_filters.status
      integer:
        - participant_age_at_collection
        - combined_filters.survival_filters.age_at_last_known_survival_status
        - combined_filters.treatment_filters.age_at_treatment_start
        - combined_filters.treatment_filters.age_at_treatment_end
        - combined_filters.treatment_response_filters.age_at_response
        - combined_filters.sample_diagnosis_genetic_analysis_filters.participant_age_at_collection
        - combined_filters.sample_diagnosis_genetic_analysis_filters.age_at_diagnosis
      float:
        - percent_tumor
        - percent_necrosis
      long:
        - file_size
      text:
        - files
    initial_query:
      query: |
        MATCH (f:
          clinical_measure_file |
          generic_file |
          radiology_file |
          cytogenomic_file |
          sequencing_file |
          pathology_file |
          methylation_array_file
        )
        WITH DISTINCT f.dcf_indexd_guid AS id
        SKIP $skip LIMIT $limit
        RETURN
          id
      page_size: 5000
    update_queries:
      - name: "study_properties"
        query: |
          MATCH (f:
            clinical_measure_file |
            generic_file |
            radiology_file |
            cytogenomic_file |
            sequencing_file |
            pathology_file |
            methylation_array_file
          )
          WHERE f.dcf_indexd_guid IS NOT NULL

          WITH
            f.dcf_indexd_guid AS id,
            collect(DISTINCT f) AS file_nodes

          SKIP $skip
          LIMIT $limit

          UNWIND file_nodes AS f

          OPTIONAL MATCH (f)-[
            :of_clinical_measure_file |
            of_generic_file |
            of_radiology_file |
            of_cytogenomic_file |
            of_sequencing_file |
            of_pathology_file |
            of_methylation_array_file |
            of_sample |
            of_pdx |
            of_cell_line |
            of_participant |
            of_consent_group
            *..6
          ]->(st:study)

          WITH
            id,
            head(collect(DISTINCT st)) AS first_study

          RETURN
            id,
            first_study.study_id AS study_id,
            first_study.dbgap_accession AS dbgap_accession,
            first_study.study_phase AS study_phase,
            first_study.study_acronym AS study_acronym,
            first_study.study_name AS study_name
        page_size: 5000
      - name: "file_properties"
        query: |
          MATCH (f:
            clinical_measure_file |
            generic_file |
            radiology_file |
            cytogenomic_file |
            sequencing_file |
            pathology_file |
            methylation_array_file
          )
          WITH DISTINCT f.dcf_indexd_guid AS id, head(collect(f)) AS first_file
          SKIP $skip LIMIT $limit
          RETURN
            id,
            first_file.file_name AS file_name,
            first_file.data_category AS data_category,
            first_file.file_type AS file_type,
            first_file.file_description AS file_description,
            first_file.file_size AS file_size,
            first_file.md5sum AS md5sum,
            first_file.file_mapping_level AS file_mapping_level,
            first_file.file_access AS file_access,
            first_file.library_selection AS library_selection,
            first_file.library_source_material AS library_source_material,
            first_file.library_source_molecule AS library_source_molecule,
            first_file.library_strategy AS library_strategy,
            first_file.fixation_embedding_method AS fixation_embedding_method,
            first_file.staining_method AS staining_method,
            [id] as files
        page_size: 5000
      - name: "combined_filters_study_level"
        query: |
          MATCH (f:
            clinical_measure_file |
            generic_file
          )-->(st:study)
          WITH
            distinct f.dcf_indexd_guid AS file_guid

          SKIP $skip
          LIMIT $limit

          RETURN
            file_guid AS id,
            file_guid AS file_id,
            null AS pid,
            null AS participant_id,
            null AS sample_id,
            null As consent_codes, // study level files should not have consent codes
            null AS anatomic_site,
            null AS participant_age_at_collection,
            null AS sample_tumor_status,
            null AS tumor_spatial_extent,
            null AS sample_description,
            null AS percent_tumor,
            null AS percent_necrosis,
            [file_guid] AS files,
            [{
              participant_id: null,
              race: null,
              sex_at_birth: null,
              sample_diagnosis_genetic_analysis_filters: [],
              survival_filters: [],
              treatment_filters: [],
              treatment_response_filters: []
            }] AS combined_filters
        page_size: 10000 # There were only 140 results in my local Memgraph, so we can use page size 10k or more to collect all study level files
      - name: "combined_filters_participant_level"
        query: |
          MATCH (f:
            clinical_measure_file |
            generic_file |
            radiology_file
          )-->(:participant)

          WITH
            f.dcf_indexd_guid AS file_guid,
            collect(DISTINCT f) AS file_nodes

          SKIP $skip
          LIMIT $limit

          UNWIND file_nodes AS f

          MATCH (f)-[:of_clinical_measure_file|of_generic_file|of_radiology_file]->(p:participant)

          WITH DISTINCT
            file_guid,
            p

          // Start Sample-based paths
          OPTIONAL MATCH (p)<-[:of_sample]-(direct_sm:sample)

          WITH
            file_guid,
            p,
            collect(DISTINCT CASE
              WHEN direct_sm IS NOT NULL THEN {
                sm: direct_sm,
                source_sm: direct_sm
              }
            END) AS direct_sample_contexts

          // Sample->Sample
          OPTIONAL MATCH (p)<-[:of_sample]-(sm1_model:sample)<-[:of_cell_line|of_pdx]-(model)<-[:of_sample]-(sm2_model:sample)
          WHERE model:cell_line OR model:pdx

          WITH
            file_guid,
            p,
            direct_sample_contexts
            +
            collect(DISTINCT CASE
              WHEN sm1_model IS NOT NULL THEN {
                sm: sm1_model,
                source_sm: sm1_model
              }
            END)
            +
            collect(DISTINCT CASE
              WHEN sm2_model IS NOT NULL THEN {
                sm: sm2_model,
                source_sm: sm2_model
              }
            END)
            +
            collect(DISTINCT CASE
              WHEN sm1_model IS NOT NULL AND sm2_model IS NOT NULL THEN {
                sm: sm1_model,
                source_sm: sm2_model
              }
            END)
            +
            collect(DISTINCT CASE
              WHEN sm1_model IS NOT NULL AND sm2_model IS NOT NULL THEN {
                sm: sm2_model,
                source_sm: sm1_model
              }
            END) AS raw_sample_contexts

          WITH
            file_guid,
            p,
            [
              sample_ctx IN raw_sample_contexts
              WHERE sample_ctx IS NOT NULL
                AND sample_ctx.sm IS NOT NULL
                AND sample_ctx.source_sm IS NOT NULL
            ] AS sample_contexts

          WITH
            file_guid,
            p,
            CASE
              WHEN size(sample_contexts) = 0 THEN [{ sm: null, source_sm: null }]
              ELSE sample_contexts
            END AS sample_contexts

          UNWIND sample_contexts AS sample_ctx

          WITH
            file_guid,
            p,
            sample_ctx.sm AS sm,
            sample_ctx.source_sm AS source_sm

          // Participant<-Diagnosis and Sample<-Diagnosis paths
          OPTIONAL MATCH (source_sm)<-[:of_diagnosis]-(sample_dg:diagnosis)
          OPTIONAL MATCH (p)<-[:of_diagnosis]-(participant_dg:diagnosis)

          WITH
            file_guid,
            p,
            sm,
            source_sm,
            collect(DISTINCT sample_dg) + collect(DISTINCT participant_dg) AS diagnosis_nodes

          // Participant<-Genetic Analysis and Sample<-Genetic Analysis paths
          OPTIONAL MATCH (source_sm)<-[:of_genetic_analysis]-(sample_ga:genetic_analysis)
          OPTIONAL MATCH (p)<-[:of_genetic_analysis]-(participant_ga:genetic_analysis)

          WITH
            file_guid,
            p,
            sm,
            [x IN diagnosis_nodes WHERE x IS NOT NULL] AS diagnoses,
            collect(DISTINCT sample_ga) + collect(DISTINCT participant_ga) AS ga_nodes

          WITH
            file_guid,
            p,
            sm,
            diagnoses,
            [x IN ga_nodes WHERE x IS NOT NULL] AS gas

          UNWIND CASE
            WHEN size(diagnoses) = 0 THEN [null]
            ELSE diagnoses
          END AS dg

          UNWIND CASE
            WHEN size(gas) = 0 THEN [null]
            ELSE gas
          END AS ga

          WITH
            file_guid,
            p,
            sm,
            collect(DISTINCT {
              sample_anatomic_site: CASE WHEN sm IS NOT NULL THEN sm.anatomic_site ELSE null END,
              participant_age_at_collection: CASE WHEN sm IS NOT NULL THEN sm.participant_age_at_collection ELSE null END,
              sample_tumor_status: CASE WHEN sm IS NOT NULL THEN sm.sample_tumor_status ELSE null END,
              tumor_spatial_extent: CASE WHEN sm IS NOT NULL THEN sm.tumor_spatial_extent ELSE null END,

              age_at_diagnosis: CASE WHEN dg IS NOT NULL THEN dg.age_at_diagnosis ELSE null END,
              diagnosis_anatomic_site: CASE WHEN dg IS NOT NULL THEN dg.anatomic_site ELSE null END,
              disease_phase: CASE WHEN dg IS NOT NULL THEN dg.disease_phase ELSE null END,
              diagnosis_classification_system: CASE WHEN dg IS NOT NULL THEN dg.diagnosis_classification_system ELSE null END,
              diagnosis_category: CASE WHEN dg IS NOT NULL THEN dg.diagnosis_category ELSE null END,
              diagnosis_basis: CASE WHEN dg IS NOT NULL THEN dg.diagnosis_basis ELSE null END,
              diagnosis: CASE WHEN dg IS NOT NULL THEN dg.diagnosis ELSE null END,

              reported_significance: CASE WHEN ga IS NOT NULL THEN ga.reported_significance ELSE null END,
              reported_significance_system: CASE WHEN ga IS NOT NULL THEN ga.reported_significance_system ELSE null END,
              gene_symbol: CASE WHEN ga IS NOT NULL THEN ga.gene_symbol ELSE null END,
              alteration: CASE WHEN ga IS NOT NULL THEN ga.alteration ELSE null END,
              fusion_partner_gene: CASE WHEN ga IS NOT NULL THEN ga.fusion_partner_gene ELSE null END,
              alteration_type: CASE WHEN ga IS NOT NULL THEN ga.alteration_type ELSE null END,
              status: CASE WHEN ga IS NOT NULL THEN ga.status ELSE null END
            }) AS sample_diagnosis_genetic_analysis_filters

          OPTIONAL MATCH (p)<-[:of_survival]-(su:survival)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            collect(DISTINCT su) AS survival_nodes

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            [x IN survival_nodes WHERE x IS NOT NULL |
              {
                last_known_survival_status: x.last_known_survival_status,
                cause_of_death: x.cause_of_death,
                first_event: x.first_event,
                age_at_last_known_survival_status: x.age_at_last_known_survival_status
              }
            ] AS survival_filters

          OPTIONAL MATCH (p)<-[:of_treatment_chemotherapy]-(tchemo:treatment_chemotherapy)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            collect(DISTINCT tchemo) AS chemotherapy_nodes

          OPTIONAL MATCH (p)<-[:of_treatment_radiation]-(trad:treatment_radiation)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            chemotherapy_nodes,
            collect(DISTINCT trad) AS radiation_nodes

          OPTIONAL MATCH (p)<-[:of_treatment_surgery]-(tsurg:treatment_surgery)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            chemotherapy_nodes,
            radiation_nodes,
            collect(DISTINCT tsurg) AS surgery_nodes

          OPTIONAL MATCH (p)<-[:of_treatment_other]-(tother:treatment_other)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            chemotherapy_nodes,
            radiation_nodes,
            surgery_nodes,
            collect(DISTINCT tother) AS other_treatment_nodes

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            [x IN chemotherapy_nodes WHERE x IS NOT NULL |
              {
                treatment_type: coalesce(x.treatment_type, x.chemotherapy_type, 'chemotherapy'),
                treatment_agent: coalesce(x.treatment_agent, x.chemotherapy_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }
            ] AS chemo_filters,
            [x IN radiation_nodes WHERE x IS NOT NULL |
              {
                treatment_type: coalesce(x.treatment_type, x.radiation_type, 'radiation'),
                treatment_agent: coalesce(x.treatment_agent, x.radiation_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }
            ] AS radiation_filters,
            [x IN surgery_nodes WHERE x IS NOT NULL |
              {
                treatment_type: coalesce(x.treatment_type, x.surgery_type, 'surgery'),
                treatment_agent: coalesce(x.treatment_agent, x.surgery_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }
            ] AS surgery_filters,
            [x IN other_treatment_nodes WHERE x IS NOT NULL |
              {
                treatment_type: coalesce(x.treatment_type, x.other_treatment_type, 'other'),
                treatment_agent: coalesce(x.treatment_agent, x.other_treatment_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }
            ] AS other_filters

          WITH 
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            chemo_filters + radiation_filters + surgery_filters + other_filters AS treatment_filters

          OPTIONAL MATCH (p)<-[:of_treatment_response]-(tresp:treatment_response)

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            treatment_filters,
            collect(DISTINCT tresp) AS response_nodes

          WITH
            file_guid,
            p,
            sm,
            sample_diagnosis_genetic_analysis_filters,
            survival_filters,
            treatment_filters,
            [x IN response_nodes WHERE x IS NOT NULL |
              {
                response_category: x.response_category,
                age_at_response: x.age_at_response,
                response: x.response,
                response_system: x.response_system
              }
            ] AS treatment_response_filters

          WITH
            file_guid,
            p,
            collect(DISTINCT sm.sample_id) AS raw_sample_ids,
            collect(DISTINCT sample_diagnosis_genetic_analysis_filters) AS sdga_filter_lists,
            collect(DISTINCT survival_filters) AS survival_filter_lists,
            collect(DISTINCT treatment_filters) AS treatment_filter_lists,
            collect(DISTINCT treatment_response_filters) AS treatment_response_filter_lists

          OPTIONAL MATCH (p)-[:of_participant]->(cg:consent_group)

          WITH
            file_guid,
            p,
            raw_sample_ids,
            sdga_filter_lists,
            survival_filter_lists,
            treatment_filter_lists,
            treatment_response_filter_lists,
            [x IN collect(DISTINCT cg.consent_group_name) WHERE x IS NOT NULL] AS consent_codes_for_participant

          WITH
            file_guid,
            p,
            consent_codes_for_participant,
            [x IN raw_sample_ids WHERE x IS NOT NULL] AS sample_ids_for_participant,
            reduce(acc = [], xs IN sdga_filter_lists | acc + xs) AS raw_sdga_filters,
            reduce(acc = [], xs IN survival_filter_lists | acc + xs) AS raw_survival_filters,
            reduce(acc = [], xs IN treatment_filter_lists | acc + xs) AS raw_treatment_filters,
            reduce(acc = [], xs IN treatment_response_filter_lists | acc + xs) AS raw_treatment_response_filters

          WITH
            file_guid,
            {
              pids: CASE WHEN p IS NOT NULL THEN [p.guid] ELSE [] END,
              participant_ids: CASE WHEN p IS NOT NULL THEN [p.participant_id] ELSE [] END,
              consent_codes: consent_codes_for_participant,
              sample_ids: sample_ids_for_participant,
              combined_filters: [{
                participant_id: CASE WHEN p IS NOT NULL THEN p.participant_id ELSE null END,
                race: CASE WHEN p IS NOT NULL THEN p.race ELSE null END,
                sex_at_birth: CASE WHEN p IS NOT NULL THEN p.sex_at_birth ELSE null END,

                sample_diagnosis_genetic_analysis_filters:
                  reduce(acc = [], x IN raw_sdga_filters |
                    CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
                  ),

                survival_filters:
                  reduce(acc = [], x IN raw_survival_filters |
                    CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
                  ),

                treatment_filters:
                  reduce(acc = [], x IN raw_treatment_filters |
                    CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
                  ),

                treatment_response_filters:
                  reduce(acc = [], x IN raw_treatment_response_filters |
                    CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
                  )
              }]
            } AS output_row

          WITH
            file_guid,
            collect(output_row) AS output_rows

          WITH
            file_guid,
            reduce(acc = [], r IN output_rows | acc + r.pids) AS raw_pids,
            reduce(acc = [], r IN output_rows | acc + r.participant_ids) AS raw_participant_ids,
            reduce(acc = [], r IN output_rows | acc + r.consent_codes) AS raw_consent_codes,
            reduce(acc = [], r IN output_rows | acc + r.sample_ids) AS raw_sample_ids,
            reduce(acc = [], r IN output_rows | acc + r.combined_filters) AS raw_combined_filters

          WITH
            file_guid,

            reduce(acc = [], x IN raw_pids |
              CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
            ) AS pids,

            reduce(acc = [], x IN raw_participant_ids |
              CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
            ) AS participant_ids,

            reduce(acc = [], x IN raw_consent_codes |
              CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
            ) AS consent_codes,

            reduce(acc = [], x IN raw_sample_ids |
              CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
            ) AS sample_ids,

            reduce(acc = [], x IN raw_combined_filters |
              CASE WHEN x IS NULL OR x IN acc THEN acc ELSE acc + [x] END
            ) AS combined_filters

          RETURN
            file_guid AS id,
            file_guid AS file_id,
            pids AS pid,
            participant_ids AS participant_id,
            null AS sample_id, // No sample ids for participant level files
            consent_codes AS consent_codes,
            null AS anatomic_site,
            null AS participant_age_at_collection,
            null AS sample_tumor_status,
            null AS tumor_spatial_extent,
            null AS sample_description,
            null AS percent_tumor,
            null AS percent_necrosis,
            [file_guid] AS files,
            combined_filters AS combined_filters
        page_size: 1000
      - name: "combined_filters_sample_level"
        query: |
          MATCH (f:
            clinical_measure_file |
            generic_file |
            cytogenomic_file |
            methylation_array_file |
            pathology_file |
            sequencing_file
          )-[:of_clinical_measure_file|of_generic_file|of_cytogenomic_file|of_methylation_array_file|of_pathology_file|of_sequencing_file]->(direct_sm:sample)
          WHERE f.dcf_indexd_guid IS NOT NULL

          WITH
            f.dcf_indexd_guid AS file_guid,
            collect(DISTINCT direct_sm) AS direct_samples

          SKIP $skip
          LIMIT $limit

          CALL {
            WITH direct_samples

            UNWIND direct_samples AS seed_sm
            OPTIONAL MATCH (seed_sm)-[:of_sample]->(out_cell:cell_line)

            WITH
              direct_samples,
              seed_sm,
              collect(DISTINCT out_cell) AS raw_models

            OPTIONAL MATCH (seed_sm)-[:of_sample]->(out_pdx:pdx)

            WITH
              direct_samples,
              seed_sm,
              raw_models + collect(DISTINCT out_pdx) AS raw_models

            OPTIONAL MATCH (seed_sm)<-[:of_cell_line]-(in_cell:cell_line)

            WITH
              direct_samples,
              seed_sm,
              raw_models + collect(DISTINCT in_cell) AS raw_models

            OPTIONAL MATCH (seed_sm)<-[:of_pdx]-(in_pdx:pdx)

            WITH
              direct_samples,
              raw_models + collect(DISTINCT in_pdx) AS raw_models

            WITH
              direct_samples,
              [m IN raw_models WHERE m IS NOT NULL] AS models

            UNWIND CASE WHEN size(models) = 0 THEN [null] ELSE models END AS model
            OPTIONAL MATCH (model)<-[:of_sample]-(same_model_sm:sample)

            WITH
              direct_samples,
              models,
              collect(DISTINCT same_model_sm) AS same_model_samples

            UNWIND CASE WHEN size(models) = 0 THEN [null] ELSE models END AS model
            OPTIONAL MATCH (model)-[:of_cell_line|of_pdx]->(model_edge_sm:sample)

            WITH
              direct_samples +
              same_model_samples +
              collect(DISTINCT model_edge_sm) AS raw_samples

            UNWIND raw_samples AS sm
            WITH DISTINCT sm
            WHERE sm IS NOT NULL

            RETURN collect(sm) AS associated_samples
          }

          UNWIND associated_samples AS sm

          CALL {
            WITH sm

            OPTIONAL MATCH (sm)-[:of_sample]->(direct_p:participant)

            WITH
              sm,
              collect(DISTINCT direct_p) AS direct_participants

            OPTIONAL MATCH (sm)<-[:of_diagnosis]-(sample_dg:diagnosis)-[:of_diagnosis]->(diagnosis_p:participant)

            WITH
              sm,
              direct_participants + collect(DISTINCT diagnosis_p) AS sample_and_diagnosis_participants

            OPTIONAL MATCH (sm)-[:of_sample]->(cell_model:cell_line)-[:of_cell_line]->(cell_p:participant)

            WITH
              sm,
              sample_and_diagnosis_participants,
              collect(DISTINCT cell_p) AS model_participants

            OPTIONAL MATCH (sm)-[:of_sample]->(pdx_model:pdx)-[:of_pdx]->(pdx_p:participant)

            WITH
              sm,
              sample_and_diagnosis_participants,
              model_participants + collect(DISTINCT pdx_p) AS model_participants

            OPTIONAL MATCH (sm)<-[:of_cell_line]-(incoming_cell_model:cell_line)-[:of_cell_line]->(incoming_cell_p:participant)

            WITH
              sm,
              sample_and_diagnosis_participants,
              model_participants + collect(DISTINCT incoming_cell_p) AS model_participants

            OPTIONAL MATCH (sm)<-[:of_pdx]-(incoming_pdx_model:pdx)-[:of_pdx]->(incoming_pdx_p:participant)

            WITH
              sample_and_diagnosis_participants +
              model_participants +
              collect(DISTINCT incoming_pdx_p) AS raw_participants

            WITH
              [p IN raw_participants WHERE p IS NOT NULL] AS participants

            RETURN
              CASE
                WHEN size(participants) = 0 THEN [null]
                ELSE participants
              END AS participants
          }

          UNWIND participants AS p

          CALL {
            WITH sm, p

            OPTIONAL MATCH (sm)<-[:of_diagnosis]-(sample_dg:diagnosis)
            OPTIONAL MATCH (p)<-[:of_diagnosis]-(participant_dg:diagnosis)

            WITH
              sm,
              collect(DISTINCT sample_dg) + collect(DISTINCT participant_dg) AS raw_diagnoses,
              p

            OPTIONAL MATCH (sm)<-[:of_genetic_analysis]-(sample_ga:genetic_analysis)
            OPTIONAL MATCH (p)<-[:of_genetic_analysis]-(participant_ga:genetic_analysis)

            WITH
              sm,
              [dg IN raw_diagnoses WHERE dg IS NOT NULL] AS diagnoses,
              [ga IN collect(DISTINCT sample_ga) + collect(DISTINCT participant_ga) WHERE ga IS NOT NULL] AS genetic_analyses

            UNWIND CASE WHEN size(diagnoses) = 0 THEN [null] ELSE diagnoses END AS dg
            UNWIND CASE WHEN size(genetic_analyses) = 0 THEN [null] ELSE genetic_analyses END AS ga

            WITH DISTINCT
              CASE WHEN sm IS NOT NULL THEN sm.anatomic_site ELSE null END AS sample_anatomic_site,
              CASE WHEN sm IS NOT NULL THEN sm.participant_age_at_collection ELSE null END AS participant_age_at_collection,
              CASE WHEN sm IS NOT NULL THEN sm.sample_tumor_status ELSE null END AS sample_tumor_status,
              CASE WHEN sm IS NOT NULL THEN sm.tumor_spatial_extent ELSE null END AS tumor_spatial_extent,
              CASE WHEN dg IS NOT NULL THEN dg.age_at_diagnosis ELSE null END AS age_at_diagnosis,
              CASE WHEN dg IS NOT NULL THEN dg.anatomic_site ELSE null END AS diagnosis_anatomic_site,
              CASE WHEN dg IS NOT NULL THEN dg.disease_phase ELSE null END AS disease_phase,
              CASE WHEN dg IS NOT NULL THEN dg.diagnosis_classification_system ELSE null END AS diagnosis_classification_system,
              CASE WHEN dg IS NOT NULL THEN dg.diagnosis_category ELSE null END AS diagnosis_category,
              CASE WHEN dg IS NOT NULL THEN dg.diagnosis_basis ELSE null END AS diagnosis_basis,
              CASE WHEN dg IS NOT NULL THEN dg.diagnosis ELSE null END AS diagnosis,
              CASE WHEN ga IS NOT NULL THEN ga.reported_significance ELSE null END AS reported_significance,
              CASE WHEN ga IS NOT NULL THEN ga.reported_significance_system ELSE null END AS reported_significance_system,
              CASE WHEN ga IS NOT NULL THEN ga.gene_symbol ELSE null END AS gene_symbol,
              CASE WHEN ga IS NOT NULL THEN ga.alteration ELSE null END AS alteration,
              CASE WHEN ga IS NOT NULL THEN ga.fusion_partner_gene ELSE null END AS fusion_partner_gene,
              CASE WHEN ga IS NOT NULL THEN ga.alteration_type ELSE null END AS alteration_type,
              CASE WHEN ga IS NOT NULL THEN ga.status ELSE null END AS status

            RETURN collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status
            }) AS sample_diagnosis_genetic_analysis_filters
          }

          WITH
            file_guid,
            associated_samples,
            p,
            collect(DISTINCT sample_diagnosis_genetic_analysis_filters) AS sdga_filter_lists

          WITH
            file_guid,
            associated_samples,
            p,
            reduce(raw_sdga_filters = [], filter_list IN sdga_filter_lists |
              raw_sdga_filters + filter_list
            ) AS raw_sdga_filters

          CALL {
            WITH raw_sdga_filters

            WITH [filter_entry IN raw_sdga_filters WHERE filter_entry IS NOT NULL] AS raw_sdga_filters

            UNWIND raw_sdga_filters AS filter_entry

            WITH DISTINCT
              filter_entry.sample_anatomic_site AS sample_anatomic_site,
              filter_entry.participant_age_at_collection AS participant_age_at_collection,
              filter_entry.sample_tumor_status AS sample_tumor_status,
              filter_entry.tumor_spatial_extent AS tumor_spatial_extent,
              filter_entry.age_at_diagnosis AS age_at_diagnosis,
              filter_entry.diagnosis_anatomic_site AS diagnosis_anatomic_site,
              filter_entry.disease_phase AS disease_phase,
              filter_entry.diagnosis_classification_system AS diagnosis_classification_system,
              filter_entry.diagnosis_category AS diagnosis_category,
              filter_entry.diagnosis_basis AS diagnosis_basis,
              filter_entry.diagnosis AS diagnosis,
              filter_entry.reported_significance AS reported_significance,
              filter_entry.reported_significance_system AS reported_significance_system,
              filter_entry.gene_symbol AS gene_symbol,
              filter_entry.alteration AS alteration,
              filter_entry.fusion_partner_gene AS fusion_partner_gene,
              filter_entry.alteration_type AS alteration_type,
              filter_entry.status AS status

            RETURN collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status
            }) AS sample_diagnosis_genetic_analysis_filters
          }

          CALL {
            WITH p
            OPTIONAL MATCH (p)<-[:of_survival]-(su:survival)
            RETURN [x IN collect(DISTINCT su) WHERE x IS NOT NULL | {
              last_known_survival_status: x.last_known_survival_status,
              cause_of_death: x.cause_of_death,
              first_event: x.first_event,
              age_at_last_known_survival_status: x.age_at_last_known_survival_status
            }] AS survival_filters
          }

          CALL {
            WITH p

            OPTIONAL MATCH (p)<-[:of_treatment_chemotherapy]-(tchemo:treatment_chemotherapy)

            WITH
              p,
              [x IN collect(DISTINCT tchemo) WHERE x IS NOT NULL | {
                treatment_type: coalesce(x.treatment_type, x.chemotherapy_type, 'chemotherapy'),
                treatment_agent: coalesce(x.treatment_agent, x.chemotherapy_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }] AS chemo_filters

            OPTIONAL MATCH (p)<-[:of_treatment_radiation]-(trad:treatment_radiation)

            WITH
              p,
              chemo_filters,
              [x IN collect(DISTINCT trad) WHERE x IS NOT NULL | {
                treatment_type: coalesce(x.treatment_type, x.radiation_type, 'radiation'),
                treatment_agent: coalesce(x.treatment_agent, x.radiation_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }] AS radiation_filters

            OPTIONAL MATCH (p)<-[:of_treatment_surgery]-(tsurg:treatment_surgery)

            WITH
              p,
              chemo_filters,
              radiation_filters,
              [x IN collect(DISTINCT tsurg) WHERE x IS NOT NULL | {
                treatment_type: coalesce(x.treatment_type, x.surgery_type, 'surgery'),
                treatment_agent: coalesce(x.treatment_agent, x.surgery_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }] AS surgery_filters

            OPTIONAL MATCH (p)<-[:of_treatment_other]-(tother:treatment_other)

            RETURN
              chemo_filters +
              radiation_filters +
              surgery_filters +
              [x IN collect(DISTINCT tother) WHERE x IS NOT NULL | {
                treatment_type: coalesce(x.treatment_type, x.other_treatment_type, 'other'),
                treatment_agent: coalesce(x.treatment_agent, x.other_treatment_agent),
                age_at_treatment_start: x.age_at_treatment_start,
                age_at_treatment_end: x.age_at_treatment_end
              }] AS treatment_filters
          }

          CALL {
            WITH p
            OPTIONAL MATCH (p)<-[:of_treatment_response]-(tresp:treatment_response)
            RETURN [x IN collect(DISTINCT tresp) WHERE x IS NOT NULL | {
              response_category: x.response_category,
              age_at_response: x.age_at_response,
              response: x.response,
              response_system: x.response_system
            }] AS treatment_response_filters
          }

          WITH
            file_guid,
            associated_samples,
            p,
            {
              participant_id: CASE WHEN p IS NOT NULL THEN p.participant_id ELSE null END,
              race: CASE WHEN p IS NOT NULL THEN p.race ELSE null END,
              sex_at_birth: CASE WHEN p IS NOT NULL THEN p.sex_at_birth ELSE null END,
              sample_diagnosis_genetic_analysis_filters: sample_diagnosis_genetic_analysis_filters,
              survival_filters: survival_filters,
              treatment_filters: treatment_filters,
              treatment_response_filters: treatment_response_filters
            } AS combined_filter

          WITH
            file_guid,
            associated_samples,
            collect({
              participant_node: p,
              combined_filter: combined_filter
            }) AS raw_combined_filter_entries

          UNWIND raw_combined_filter_entries AS raw_combined_filter_entry

          WITH
            file_guid,
            associated_samples,
            raw_combined_filter_entry.participant_node AS participant_node,
            collect(raw_combined_filter_entry.combined_filter) AS participant_combined_filters

          WITH
            file_guid,
            associated_samples,
            participant_node,
            head(participant_combined_filters) AS participant_combined_filter,
            reduce(raw_sdga_filters = [], filter_entry IN participant_combined_filters |
              raw_sdga_filters + filter_entry.sample_diagnosis_genetic_analysis_filters
            ) AS raw_sdga_filters

          CALL {
            WITH raw_sdga_filters

            WITH [filter_entry IN raw_sdga_filters WHERE filter_entry IS NOT NULL] AS raw_sdga_filters

            UNWIND raw_sdga_filters AS filter_entry

            WITH DISTINCT
              filter_entry.sample_anatomic_site AS sample_anatomic_site,
              filter_entry.participant_age_at_collection AS participant_age_at_collection,
              filter_entry.sample_tumor_status AS sample_tumor_status,
              filter_entry.tumor_spatial_extent AS tumor_spatial_extent,
              filter_entry.age_at_diagnosis AS age_at_diagnosis,
              filter_entry.diagnosis_anatomic_site AS diagnosis_anatomic_site,
              filter_entry.disease_phase AS disease_phase,
              filter_entry.diagnosis_classification_system AS diagnosis_classification_system,
              filter_entry.diagnosis_category AS diagnosis_category,
              filter_entry.diagnosis_basis AS diagnosis_basis,
              filter_entry.diagnosis AS diagnosis,
              filter_entry.reported_significance AS reported_significance,
              filter_entry.reported_significance_system AS reported_significance_system,
              filter_entry.gene_symbol AS gene_symbol,
              filter_entry.alteration AS alteration,
              filter_entry.fusion_partner_gene AS fusion_partner_gene,
              filter_entry.alteration_type AS alteration_type,
              filter_entry.status AS status

            RETURN collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status
            }) AS sample_diagnosis_genetic_analysis_filters
          }

          WITH
            file_guid,
            associated_samples,
            collect(DISTINCT participant_node) AS participant_nodes,
            collect({
              participant_id: participant_combined_filter.participant_id,
              race: participant_combined_filter.race,
              sex_at_birth: participant_combined_filter.sex_at_birth,
              sample_diagnosis_genetic_analysis_filters: sample_diagnosis_genetic_analysis_filters,
              survival_filters: participant_combined_filter.survival_filters,
              treatment_filters: participant_combined_filter.treatment_filters,
              treatment_response_filters: participant_combined_filter.treatment_response_filters
            }) AS combined_filters

          CALL {
            WITH participant_nodes

            UNWIND CASE
              WHEN size(participant_nodes) = 0 THEN [null]
              ELSE participant_nodes
            END AS participant_node_for_consent

            OPTIONAL MATCH (participant_node_for_consent)-[:of_participant]->(cg:consent_group)

            RETURN [x IN collect(DISTINCT cg.consent_group_name) WHERE x IS NOT NULL] AS consent_codes
          }

          WITH
            file_guid,
            associated_samples,
            participant_nodes,
            combined_filters,
            consent_codes

          RETURN
            file_guid AS id,
            file_guid AS file_id,
            [p IN participant_nodes WHERE p IS NOT NULL AND p.guid IS NOT NULL | p.guid] AS pid,
            [p IN participant_nodes WHERE p IS NOT NULL AND p.participant_id IS NOT NULL | p.participant_id] AS participant_id,
            reduce(sample_ids = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.sample_id IS NULL OR sample_node.sample_id IN sample_ids THEN sample_ids
                ELSE sample_ids + [sample_node.sample_id]
              END
            ) AS sample_id,
            consent_codes AS consent_codes,
            reduce(anatomic_sites = [], sample_node IN associated_samples |
              reduce(inner_sites = anatomic_sites, site IN coalesce(sample_node.anatomic_site, []) |
                CASE
                  WHEN site IS NULL OR site IN inner_sites THEN inner_sites
                  ELSE inner_sites + [site]
                END
              )
            ) AS anatomic_site,
            reduce(collection_ages = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.participant_age_at_collection IS NULL OR sample_node.participant_age_at_collection IN collection_ages THEN collection_ages
                ELSE collection_ages + [sample_node.participant_age_at_collection]
              END
            ) AS participant_age_at_collection,
            reduce(tumor_statuses = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.sample_tumor_status IS NULL OR sample_node.sample_tumor_status IN tumor_statuses THEN tumor_statuses
                ELSE tumor_statuses + [sample_node.sample_tumor_status]
              END
            ) AS sample_tumor_status,
            reduce(spatial_extents = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.tumor_spatial_extent IS NULL OR sample_node.tumor_spatial_extent IN spatial_extents THEN spatial_extents
                ELSE spatial_extents + [sample_node.tumor_spatial_extent]
              END
            ) AS tumor_spatial_extent,
            reduce(sample_descriptions = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.sample_description IS NULL OR sample_node.sample_description IN sample_descriptions THEN sample_descriptions
                ELSE sample_descriptions + [sample_node.sample_description]
              END
            ) AS sample_description,
            reduce(percent_tumors = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.percent_tumor IS NULL OR sample_node.percent_tumor IN percent_tumors THEN percent_tumors
                ELSE percent_tumors + [sample_node.percent_tumor]
              END
            ) AS percent_tumor,
            reduce(percent_necroses = [], sample_node IN associated_samples |
              CASE
                WHEN sample_node.percent_necrosis IS NULL OR sample_node.percent_necrosis IN percent_necroses THEN percent_necroses
                ELSE percent_necroses + [sample_node.percent_necrosis]
              END
            ) AS percent_necrosis,
            [file_guid] AS files,
            combined_filters AS combined_filters
        page_size: 1000
