  - index_name: survivals_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - survival_id
        - study_id
        - dbgap_accession
        - study_phase
        - study_acronym
        - study_name
        - participant_id
        - pid
        - race
        - sex_at_birth
        - age_at_event_free_survival_status_str
        - age_at_last_known_survival_status_str
        - cause_of_death
        - event_free_survival_status
        - first_event
        - last_known_survival_status
        - treatment_filters.treatment_type
        - treatment_filters.treatment_agent
        - treatment_response_filters.response
        - treatment_response_filters.response_category
        - treatment_response_filters.response_system
        - sample_diagnosis_genetic_analysis_file_filters.sample_anatomic_site
        - sample_diagnosis_genetic_analysis_file_filters.sample_tumor_status
        - sample_diagnosis_genetic_analysis_file_filters.tumor_spatial_extent
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_category
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_anatomic_site
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_classification_system
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_basis
        - sample_diagnosis_genetic_analysis_file_filters.disease_phase
        - sample_diagnosis_genetic_analysis_file_filters.reported_significance
        - sample_diagnosis_genetic_analysis_file_filters.reported_significance_system
        - sample_diagnosis_genetic_analysis_file_filters.gene_symbol
        - sample_diagnosis_genetic_analysis_file_filters.alteration
        - sample_diagnosis_genetic_analysis_file_filters.fusion_partner_gene
        - sample_diagnosis_genetic_analysis_file_filters.alteration_type
        - sample_diagnosis_genetic_analysis_file_filters.status
        - sample_diagnosis_genetic_analysis_file_filters.data_category
        - sample_diagnosis_genetic_analysis_file_filters.file_type
        - sample_diagnosis_genetic_analysis_file_filters.file_mapping_level
        - sample_diagnosis_genetic_analysis_file_filters.library_selection
        - sample_diagnosis_genetic_analysis_file_filters.library_source_material
        - sample_diagnosis_genetic_analysis_file_filters.library_source_molecule
        - sample_diagnosis_genetic_analysis_file_filters.library_strategy
      integer:
        - age_at_event_free_survival_status
        - age_at_last_known_survival_status
        - treatment_filters.age_at_treatment_start
        - treatment_filters.age_at_treatment_end
        - treatment_response_filters.age_at_response
        - sample_diagnosis_genetic_analysis_file_filters.participant_age_at_collection
        - sample_diagnosis_genetic_analysis_file_filters.age_at_diagnosis
    # Cypher query will be used to retrieve data from Neo4j, and index into Elasticsearch
    initial_query:
      query: |
        MATCH (sur:survival)
        WITH sur
        SKIP $skip LIMIT $limit
        RETURN sur.guid AS id
      page_size: 5000
    update_queries:
      - name: "study_properties"
        query: |
          MATCH
            (sur:survival)-[:of_survival]->(p:participant),
            (cg:consent_group)<-[:of_participant]->(p),
            (stu:study)<-[:of_consent_group]-(cg)
          WITH sur.guid AS id, stu
          SKIP $skip LIMIT $limit
          RETURN
            id,
            stu.study_id AS study_id,
            stu.dbgap_accession AS dbgap_accession,
            stu.study_phase AS study_phase,
            stu.study_acronym AS study_acronym,
            stu.study_name AS study_name
        page_size: 5000
      - name: "participant_properties"
        query: |
          MATCH (sur:survival)-[:of_survival]->(p:participant)
          WITH sur.guid AS id, p
          SKIP $skip LIMIT $limit
          RETURN
            id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            p.sex_at_birth AS sex_at_birth
        page_size: 5000
      - name: "survival_properties"
        query: |
          MATCH (sur:survival)
          WITH sur
          SKIP $skip LIMIT $limit
          RETURN
            sur.guid AS id,
            sur.survival_id AS survival_id,
            sur.age_at_event_free_survival_status AS age_at_event_free_survival_status,
            toString(sur.age_at_event_free_survival_status) AS age_at_event_free_survival_status_str,
            sur.age_at_last_known_survival_status AS age_at_last_known_survival_status,
            toString(sur.age_at_last_known_survival_status) AS age_at_last_known_survival_status_str,
            sur.cause_of_death AS cause_of_death,
            sur.event_free_survival_status AS event_free_survival_status,
            sur.first_event AS first_event,
            sur.last_known_survival_status AS last_known_survival_status
        page_size: 5000
      - name: "treatment_filters"
        query: |
          MATCH (sur:survival)-[:of_survival]->(p:participant)
          WITH sur, p
          SKIP $skip LIMIT $limit

          // Build a superlist of treatment filters
          CALL {
            // treatment_chemotherapy
            WITH sur.guid AS id, p
            OPTIONAL MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p)
            WITH
              id,
              count(tchemo) AS tchemo_count,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN tchemo.chemotherapy_type IS NULL OR size(tchemo.chemotherapy_type) = 0 THEN ['chemotherapy']
                  ELSE [x IN tchemo.chemotherapy_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: tchemo.chemotherapy_agent,
                age_at_treatment_start: tchemo.age_at_treatment_start,
                age_at_treatment_end: tchemo.age_at_treatment_end
              }) AS treatment_filters
            WITH
              id,
              CASE
                WHEN tchemo_count > 0
                THEN treatment_filters
                ELSE []
              END AS treatment_filters
            RETURN id, treatment_filters

            UNION

            // treatment_radiation
            WITH sur.guid AS id, p
            OPTIONAL MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p)
            WITH
              id,
              count(trad) AS trad_count,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN trad.treatment_type IS NULL OR size(trad.treatment_type) = 0 THEN ['radiation']
                  ELSE [x IN trad.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: trad.radiation_therapy_type,
                age_at_treatment_start: trad.age_at_treatment_start,
                age_at_treatment_end: trad.age_at_treatment_end
              }) AS treatment_filters
            WITH
              id,
              CASE
                WHEN trad_count > 0
                THEN treatment_filters
                ELSE []
              END AS treatment_filters
            RETURN id, treatment_filters

            UNION

            // treatment_surgery
            WITH sur.guid AS id, p
            OPTIONAL MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p)
            WITH
              id,
              count(tsurg) AS tsurg_count,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN tsurg.treatment_type IS NULL OR size(tsurg.treatment_type) = 0 THEN ['surgery']
                  ELSE [x IN tsurg.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: tsurg.surgery_type,
                age_at_treatment_start: tsurg.age_at_treatment_start,
                age_at_treatment_end: tsurg.age_at_treatment_end
              }) AS treatment_filters
            WITH
              id,
              CASE
                WHEN tsurg_count > 0
                THEN treatment_filters
                ELSE []
              END AS treatment_filters
            RETURN id, treatment_filters

            UNION

            // treatment_other
            WITH sur.guid AS id, p
            OPTIONAL MATCH (toth:treatment_other)-[:of_treatment_other]->(p)
            WITH
              id,
              count(toth) AS toth_count,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN toth.treatment_type IS NULL OR size(toth.treatment_type) = 0 THEN ['other']
                  ELSE [x IN toth.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: toth.other_treatment_type,
                age_at_treatment_start: toth.age_at_treatment_start,
                age_at_treatment_end: toth.age_at_treatment_end
              }) AS treatment_filters
            WITH
              id,
              CASE
                WHEN toth_count > 0
                THEN treatment_filters
                ELSE []
              END AS treatment_filters
            RETURN id, treatment_filters
          }
          WITH
            id,
            collect(treatment_filters) AS treatment_filters_superlist
          WITH
            id,
            reduce(all_filters = [], filters IN treatment_filters_superlist | all_filters + filters) AS treatment_filters
          RETURN id, treatment_filters
        page_size: 5000
      - name: "treatment_response_filters"
        query: |
          MATCH (sur:survival)-[:of_survival]->(p:participant)
          WITH sur.guid AS id, p
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (tresp:treatment_response)-[:of_treatment_response]->(p)
          WITH
            id,
            count(tresp) AS treatment_response_count,
            [item IN collect(
              DISTINCT {
                age_at_response: tresp.age_at_response,
                response: tresp.response,
                response_category: tresp.response_category,
                response_system: tresp.response_system
              }
            ) WHERE item IS NOT NULL] AS treatment_response_filters
          WITH
            id,
            CASE
              WHEN treatment_response_count > 0
              THEN treatment_response_filters
              ELSE []
            END AS treatment_response_filters
          RETURN id, treatment_response_filters
        page_size: 5000
      - name: "sample_diagnosis_genetic_analysis_file_filters"
        query: |
          MATCH (sur:survival)-[:of_survival]->(p:participant)
          WITH
            sur.guid AS id,
            p
          SKIP $skip LIMIT $limit

          // Direct participant samples: self-context
          OPTIONAL MATCH (p)<--(s1:sample)
          WITH
            id,
            p,
            collect(DISTINCT { sm: s1, source_sm: s1 }) AS direct_contexts

          // Model-linked samples: p <- Sample_1 <- cell_line/pdx <- Sample_2
          OPTIONAL MATCH (p)<-[:of_sample]-(s1_model:sample)<--(model)<--(s2:sample)
          WHERE model:cell_line OR model:pdx

          WITH
            id,
            p,
            [ctx IN (
              direct_contexts
              + collect(DISTINCT { sm: s1_model, source_sm: s1_model })
              + collect(DISTINCT { sm: s2, source_sm: s2 })
              + collect(DISTINCT { sm: s1_model, source_sm: s2 })
              + collect(DISTINCT { sm: s2, source_sm: s1_model })
            )
            WHERE ctx.sm IS NOT NULL AND ctx.source_sm IS NOT NULL] AS sample_contexts

          WITH
            id,
            p,
            CASE
              WHEN size(sample_contexts) = 0 THEN [{ sm: null, source_sm: null }]
              ELSE sample_contexts
            END AS sample_contexts

          // Study-level files
          OPTIONAL MATCH (st:study)<--(:consent_group)<--(p)
          OPTIONAL MATCH (st)<--(study_file)
          WHERE study_file:clinical_measure_file
            OR study_file:generic_file

          WITH
            id,
            p,
            sample_contexts,
            collect(DISTINCT study_file) AS study_files

          UNWIND sample_contexts AS ctx

          WITH
            id,
            p,
            ctx.sm AS sm,
            ctx.source_sm AS source_sm,
            study_files

          // Source sample-level files
          OPTIONAL MATCH (source_sm)<--(sample_file)
          WHERE sample_file:sequencing_file
            OR sample_file:generic_file
            OR sample_file:methylation_array_file
            OR sample_file:pathology_file
            OR sample_file:cytogenomic_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            collect(DISTINCT sample_file) AS sample_files

          // Participant-level files
          OPTIONAL MATCH (p)<--(participant_file)
          WHERE participant_file:clinical_measure_file
            OR participant_file:generic_file
            OR participant_file:radiology_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            collect(DISTINCT participant_file) AS participant_files

          // Source sample-level diagnosis
          OPTIONAL MATCH (source_sm)<--(sample_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            collect(DISTINCT sample_dg) AS sample_diagnoses

          // Participant-level diagnosis
          OPTIONAL MATCH (p)<--(participant_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            collect(DISTINCT participant_dg) AS participant_diagnoses

          // Source sample-level genetic analysis
          OPTIONAL MATCH (source_sm)<--(sample_ga:genetic_analysis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            participant_diagnoses,
            collect(DISTINCT sample_ga) AS sample_gas

          // Participant-level genetic analysis
          OPTIONAL MATCH (p)<--(participant_ga:genetic_analysis)

          WITH
            id,
            sm,
            sample_files + participant_files + study_files AS files,
            sample_diagnoses + participant_diagnoses AS diagnoses,
            sample_gas + collect(DISTINCT participant_ga) AS gas

          UNWIND CASE WHEN size(files) = 0 THEN [null] ELSE files END AS file
          UNWIND CASE WHEN size(diagnoses) = 0 THEN [null] ELSE diagnoses END AS dg
          UNWIND CASE WHEN size(gas) = 0 THEN [null] ELSE gas END AS ga

          WITH
            id,
            collect(DISTINCT {
              sm: sm,
              file: file,
              dg: dg,
              ga: ga
            }) AS rows

          UNWIND rows AS row
          WITH DISTINCT
            id,

            // Sample facets
            row.sm.anatomic_site AS sample_anatomic_site,
            row.sm.participant_age_at_collection AS participant_age_at_collection,
            row.sm.sample_tumor_status AS sample_tumor_status,
            row.sm.tumor_spatial_extent AS tumor_spatial_extent,

            // Diagnosis facets
            row.dg.age_at_diagnosis AS age_at_diagnosis,
            row.dg.anatomic_site AS diagnosis_anatomic_site,
            row.dg.disease_phase AS disease_phase,
            row.dg.diagnosis_classification_system AS diagnosis_classification_system,
            row.dg.diagnosis_category AS diagnosis_category,
            row.dg.diagnosis_basis AS diagnosis_basis,
            row.dg.diagnosis AS diagnosis,

            // Genetic Analysis facets
            row.ga.reported_significance AS reported_significance,
            row.ga.reported_significance_system AS reported_significance_system,
            row.ga.gene_symbol AS gene_symbol,
            row.ga.alteration AS alteration,
            row.ga.fusion_partner_gene AS fusion_partner_gene,
            row.ga.alteration_type AS alteration_type,
            row.ga.status AS status,

            // File facets
            row.file.data_category AS data_category,
            row.file.file_type AS file_type,
            row.file.file_mapping_level AS file_mapping_level,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_selection
              ELSE null
            END AS library_selection,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_material
              ELSE null
            END AS library_source_material,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_molecule
              ELSE null
            END AS library_source_molecule,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_strategy
              ELSE null
            END AS library_strategy

          RETURN
            id,
            collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status,
              data_category: data_category,
              file_type: file_type,
              file_mapping_level: file_mapping_level,
              library_selection: library_selection,
              library_source_material: library_source_material,
              library_source_molecule: library_source_molecule,
              library_strategy: library_strategy
            }) AS sample_diagnosis_genetic_analysis_file_filters
        page_size: 1000

