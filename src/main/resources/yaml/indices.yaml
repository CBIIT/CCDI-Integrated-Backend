              tchemo,
              CASE
                WHEN tchemo.chemotherapy_type IS NULL OR size(tchemo.chemotherapy_type) = 0 THEN ['chemotherapy']
                ELSE [item IN tchemo.chemotherapy_type WHERE item IS NOT NULL | trim(item)]
              END AS treatment_type
            RETURN
