              tchemo.age_at_treatment_end AS age_at_treatment_end,
              tchemo.age_at_treatment_start AS age_at_treatment_start,
              tchemo.chemotherapy_agent AS treatment_agent,
              reduce(result = '', item IN coalesce(tchemo.chemotherapy_agent, []) |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_agent_str,
              treatment_type,
              reduce(result = '', item IN treatment_type |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_type_str

            UNION

            MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p:participant)
            WITH
              p,
              trad,
              CASE
                WHEN trad.treatment_type IS NULL OR size(trad.treatment_type) = 0 THEN ['radiation']
                ELSE [item IN trad.treatment_type WHERE item IS NOT NULL | trim(item)]
              END AS treatment_type
            RETURN
              'treatment_radiation:' + trad.guid AS id,
              trad.guid AS treatment_id,
              p,
              trad.age_at_treatment_end AS age_at_treatment_end,
              trad.age_at_treatment_start AS age_at_treatment_start,
              trad.radiation_therapy_type AS treatment_agent,
              reduce(result = '', item IN coalesce(trad.radiation_therapy_type, []) |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_agent_str,
              treatment_type,
              reduce(result = '', item IN treatment_type |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_type_str

            UNION

            MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p:participant)
            WITH
              p,
              tsurg,
              CASE
                WHEN tsurg.treatment_type IS NULL OR size(tsurg.treatment_type) = 0 THEN ['surgery']
                ELSE [item IN tsurg.treatment_type WHERE item IS NOT NULL | trim(item)]
              END AS treatment_type
            RETURN
              'treatment_surgery:' + tsurg.guid AS id,
              tsurg.guid AS treatment_id,
              p,
              tsurg.age_at_treatment_end AS age_at_treatment_end,
              tsurg.age_at_treatment_start AS age_at_treatment_start,
              tsurg.surgery_type AS treatment_agent,
              reduce(result = '', item IN coalesce(tsurg.surgery_type, []) |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_agent_str,
              treatment_type,
              reduce(result = '', item IN treatment_type |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_type_str

            UNION

            MATCH (toth:treatment_other)-[:of_treatment_other]->(p:participant)
            WITH
              p,
              toth,
              CASE
                WHEN toth.treatment_type IS NULL OR size(toth.treatment_type) = 0 THEN ['other']
                ELSE [item IN toth.treatment_type WHERE item IS NOT NULL | trim(item)]
              END AS treatment_type
            RETURN
              'treatment_other:' + toth.guid AS id,
              toth.guid AS treatment_id,
              p,
              toth.age_at_treatment_end AS age_at_treatment_end,
              toth.age_at_treatment_start AS age_at_treatment_start,
              toth.other_treatment_type AS treatment_agent,
              reduce(result = '', item IN coalesce(toth.other_treatment_type, []) |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_agent_str,
              treatment_type,
              reduce(result = '', item IN treatment_type |
                CASE
                  WHEN result = '' THEN item
                  ELSE result + ';' + item
                END
              ) AS treatment_type_str
          }
          WITH id, treatment_id, p, age_at_treatment_end, age_at_treatment_start, treatment_agent, treatment_agent_str, treatment_type, treatment_type_str
          SKIP $skip LIMIT $limit
          RETURN
            id,
            treatment_id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            reduce(result = '', x IN p.race |
              CASE
                WHEN result = '' THEN x
                ELSE result + ';' + x
              END
            ) AS race_str,
            p.sex_at_birth AS sex_at_birth,
            age_at_treatment_end AS age_at_treatment_end,
            CASE age_at_treatment_end
              WHEN -999 THEN 'Not Reported'
              ELSE toString(age_at_treatment_end)
            END AS age_at_treatment_end_str,
            age_at_treatment_start AS age_at_treatment_start,
            CASE age_at_treatment_start
              WHEN -999 THEN 'Not Reported'
              ELSE toString(age_at_treatment_start)
            END AS age_at_treatment_start_str,
            treatment_agent,
            treatment_agent_str,
            treatment_type,
            treatment_type_str
        page_size: 1000
      - name: "study_properties"
        query: |
          CALL {
            MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p:participant)
            RETURN 'treatment_chemotherapy:' + tchemo.guid AS id, p

            UNION

            MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p:participant)
            RETURN 'treatment_radiation:' + trad.guid AS id, p

            UNION

            MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p:participant)
            RETURN 'treatment_surgery:' + tsurg.guid AS id, p

            UNION

            MATCH (toth:treatment_other)-[:of_treatment_other]->(p:participant)
            RETURN 'treatment_other:' + toth.guid AS id, p
          }
          MATCH
            (p)-[:of_participant]->(cg:consent_group),
            (cg)-[:of_consent_group]->(stu:study)
          WITH id, stu
          SKIP $skip LIMIT $limit
          RETURN
            id,
            stu.study_id AS study_id,
            stu.dbgap_accession AS dbgap_accession,
            stu.study_phase AS study_phase,
            stu.study_acronym AS study_acronym,
            stu.study_name AS study_name
        page_size: 1000
      - name: "survival_filters"
        query: |
          CALL {
            MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p:participant)
            RETURN 'treatment_chemotherapy:' + tchemo.guid AS id, p

            UNION

            MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p:participant)
            RETURN 'treatment_radiation:' + trad.guid AS id, p

            UNION

            MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p:participant)
            RETURN 'treatment_surgery:' + tsurg.guid AS id, p

            UNION

            MATCH (toth:treatment_other)-[:of_treatment_other]->(p:participant)
            RETURN 'treatment_other:' + toth.guid AS id, p
          }
          WITH id, p
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sur:survival)-[:of_survival]->(p)
          WITH
            id,
            count(sur) AS survival_count,
            [item IN collect(
              DISTINCT {
                last_known_survival_status: sur.last_known_survival_status,
                cause_of_death: sur.cause_of_death,
                first_event: sur.first_event,
                age_at_last_known_survival_status: sur.age_at_last_known_survival_status
              }
            ) WHERE item IS NOT NULL] AS survival_filters
          WITH
            id,
            CASE
              WHEN survival_count > 0 THEN survival_filters
              ELSE []
            END AS survival_filters
          RETURN id, survival_filters
        page_size: 1000
      - name: "treatment_response_filters"
        query: |
          CALL {
            MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p:participant)
            RETURN 'treatment_chemotherapy:' + tchemo.guid AS id, p

            UNION

            MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p:participant)
            RETURN 'treatment_radiation:' + trad.guid AS id, p

            UNION

            MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p:participant)
            RETURN 'treatment_surgery:' + tsurg.guid AS id, p

            UNION

            MATCH (toth:treatment_other)-[:of_treatment_other]->(p:participant)
            RETURN 'treatment_other:' + toth.guid AS id, p
          }
          WITH id, p
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (tresp:treatment_response)-[:of_treatment_response]->(p)
          WITH
            id,
            count(tresp) AS treatment_response_count,
            [item IN collect(
              DISTINCT {
                age_at_response: tresp.age_at_response,
                response: tresp.response,
                response_category: tresp.response_category,
                response_system: tresp.response_system
              }
            ) WHERE item IS NOT NULL] AS treatment_response_filters
          WITH
            id,
            CASE
              WHEN treatment_response_count > 0 THEN treatment_response_filters
              ELSE []
            END AS treatment_response_filters
          RETURN id, treatment_response_filters
        page_size: 1000
      - name: "sample_diagnosis_genetic_analysis_file_filters"
        query: |
          CALL {
            MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p:participant)
            RETURN 'treatment_chemotherapy:' + tchemo.guid AS id, p

            UNION

            MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p:participant)
            RETURN 'treatment_radiation:' + trad.guid AS id, p

            UNION

            MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p:participant)
            RETURN 'treatment_surgery:' + tsurg.guid AS id, p

            UNION

            MATCH (toth:treatment_other)-[:of_treatment_other]->(p:participant)
            RETURN 'treatment_other:' + toth.guid AS id, p
          }
          WITH id, p
          SKIP $skip LIMIT $limit

          // Direct participant samples: self-context
          OPTIONAL MATCH (p)<--(s1:sample)
          WITH
            id,
            p,
            collect(DISTINCT { sm: s1, source_sm: s1 }) AS direct_contexts

          // Model-linked samples: p <- Sample_1 <- cell_line/pdx <- Sample_2
          OPTIONAL MATCH (p)<-[:of_sample]-(s1_model:sample)<--(model)<--(s2:sample)
          WHERE model:cell_line OR model:pdx

          WITH
            id,
            p,
            [ctx IN (
              direct_contexts
              + collect(DISTINCT { sm: s1_model, source_sm: s1_model })
              + collect(DISTINCT { sm: s2, source_sm: s2 })
              + collect(DISTINCT { sm: s1_model, source_sm: s2 })
              + collect(DISTINCT { sm: s2, source_sm: s1_model })
            )
            WHERE ctx.sm IS NOT NULL AND ctx.source_sm IS NOT NULL] AS sample_contexts

          WITH
            id,
            p,
            CASE
              WHEN size(sample_contexts) = 0 THEN [{ sm: null, source_sm: null }]
              ELSE sample_contexts
            END AS sample_contexts

          // Study-level files
          OPTIONAL MATCH (st:study)<--(:consent_group)<--(p)
          OPTIONAL MATCH (st)<--(study_file)
          WHERE study_file:clinical_measure_file
            OR study_file:generic_file

          WITH
            id,
            p,
            sample_contexts,
            collect(DISTINCT study_file) AS study_files

          UNWIND sample_contexts AS ctx

          WITH
            id,
            p,
            ctx.sm AS sm,
            ctx.source_sm AS source_sm,
            study_files

          // Source sample-level files
          OPTIONAL MATCH (source_sm)<--(sample_file)
          WHERE sample_file:sequencing_file
            OR sample_file:generic_file
            OR sample_file:methylation_array_file
            OR sample_file:pathology_file
            OR sample_file:cytogenomic_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            collect(DISTINCT sample_file) AS sample_files

          // Participant-level files
          OPTIONAL MATCH (p)<--(participant_file)
          WHERE participant_file:clinical_measure_file
            OR participant_file:generic_file
            OR participant_file:radiology_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            collect(DISTINCT participant_file) AS participant_files

          // Source sample-level diagnosis
          OPTIONAL MATCH (source_sm)<--(sample_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            collect(DISTINCT sample_dg) AS sample_diagnoses

          // Participant-level diagnosis
          OPTIONAL MATCH (p)<--(participant_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            collect(DISTINCT participant_dg) AS participant_diagnoses

          // Source sample-level genetic analysis
          OPTIONAL MATCH (source_sm)<--(sample_ga:genetic_analysis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            participant_diagnoses,
            collect(DISTINCT sample_ga) AS sample_gas

          // Participant-level genetic analysis
          OPTIONAL MATCH (p)<--(participant_ga:genetic_analysis)

          WITH
            id,
            sm,
            sample_files + participant_files + study_files AS files,
            sample_diagnoses + participant_diagnoses AS diagnoses,
            sample_gas + collect(DISTINCT participant_ga) AS gas

          UNWIND CASE WHEN size(files) = 0 THEN [null] ELSE files END AS file
          UNWIND CASE WHEN size(diagnoses) = 0 THEN [null] ELSE diagnoses END AS dg
          UNWIND CASE WHEN size(gas) = 0 THEN [null] ELSE gas END AS ga

          WITH
            id,
            collect(DISTINCT {
              sm: sm,
              file: file,
              dg: dg,
              ga: ga
            }) AS rows

          UNWIND rows AS row
          WITH DISTINCT
            id,

            // Sample facets
            row.sm.anatomic_site AS sample_anatomic_site,
            row.sm.participant_age_at_collection AS participant_age_at_collection,
            row.sm.sample_tumor_status AS sample_tumor_status,
            row.sm.tumor_spatial_extent AS tumor_spatial_extent,

            // Diagnosis facets
            row.dg.age_at_diagnosis AS age_at_diagnosis,
            row.dg.anatomic_site AS diagnosis_anatomic_site,
            row.dg.disease_phase AS disease_phase,
            row.dg.diagnosis_classification_system AS diagnosis_classification_system,
            row.dg.diagnosis_category AS diagnosis_category,
            row.dg.diagnosis_basis AS diagnosis_basis,
            row.dg.diagnosis AS diagnosis,

            // Genetic Analysis facets
            row.ga.reported_significance AS reported_significance,
            row.ga.reported_significance_system AS reported_significance_system,
            row.ga.gene_symbol AS gene_symbol,
            row.ga.alteration AS alteration,
            row.ga.fusion_partner_gene AS fusion_partner_gene,
            row.ga.alteration_type AS alteration_type,
            row.ga.status AS status,

            // File facets
            row.file.data_category AS data_category,
            row.file.file_type AS file_type,
            row.file.file_mapping_level AS file_mapping_level,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_selection
              ELSE null
            END AS library_selection,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_material
              ELSE null
            END AS library_source_material,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_molecule
              ELSE null
            END AS library_source_molecule,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_strategy
              ELSE null
            END AS library_strategy
          RETURN
            id,
            collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status,
              data_category: data_category,
              file_type: file_type,
              file_mapping_level: file_mapping_level,
              library_selection: library_selection,
              library_source_material: library_source_material,
              library_source_molecule: library_source_molecule,
              library_strategy: library_strategy
            }) AS sample_diagnosis_genetic_analysis_file_filters
        page_size: 1000

  - index_name: treatment_responses_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - treatment_response_id
        - pid
        - participant_id
        - race
        - race_str
        - sex_at_birth
        - study_id
        - dbgap_accession
        - study_phase
        - study_acronym
        - study_name
        - age_at_response_str
        - response
        - response_category
        - response_system
        - survival_filters.last_known_survival_status
        - survival_filters.cause_of_death
        - survival_filters.first_event
        - treatment_filters.treatment_type
        - treatment_filters.treatment_agent
        - sample_diagnosis_genetic_analysis_file_filters.sample_anatomic_site
        - sample_diagnosis_genetic_analysis_file_filters.sample_tumor_status
        - sample_diagnosis_genetic_analysis_file_filters.tumor_spatial_extent
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_category
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_anatomic_site
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_classification_system
        - sample_diagnosis_genetic_analysis_file_filters.diagnosis_basis
        - sample_diagnosis_genetic_analysis_file_filters.disease_phase
        - sample_diagnosis_genetic_analysis_file_filters.reported_significance
        - sample_diagnosis_genetic_analysis_file_filters.reported_significance_system
        - sample_diagnosis_genetic_analysis_file_filters.gene_symbol
        - sample_diagnosis_genetic_analysis_file_filters.alteration
        - sample_diagnosis_genetic_analysis_file_filters.fusion_partner_gene
        - sample_diagnosis_genetic_analysis_file_filters.alteration_type
        - sample_diagnosis_genetic_analysis_file_filters.status
        - sample_diagnosis_genetic_analysis_file_filters.data_category
        - sample_diagnosis_genetic_analysis_file_filters.file_type
        - sample_diagnosis_genetic_analysis_file_filters.file_mapping_level
        - sample_diagnosis_genetic_analysis_file_filters.library_selection
        - sample_diagnosis_genetic_analysis_file_filters.library_source_material
        - sample_diagnosis_genetic_analysis_file_filters.library_source_molecule
        - sample_diagnosis_genetic_analysis_file_filters.library_strategy
      integer:
        - age_at_response
        - survival_filters.age_at_last_known_survival_status
        - treatment_filters.age_at_treatment_start
        - treatment_filters.age_at_treatment_end
        - sample_diagnosis_genetic_analysis_file_filters.participant_age_at_collection
        - sample_diagnosis_genetic_analysis_file_filters.age_at_diagnosis
    # Cypher query will be used to retrieve data from Neo4j, and index into Elasticsearch
    initial_query:
      query: |
        MATCH (tresp:treatment_response)
        WITH tresp
        SKIP $skip LIMIT $limit
        RETURN tresp.guid AS id
      page_size: 5000
    update_queries:
      - name: "tresp_and_participant_properties"
        query: |
          MATCH (tresp:treatment_response)-[:of_treatment_response]->(p:participant)
          WITH tresp, p
          SKIP $skip LIMIT $limit
          RETURN
            tresp.guid AS id,
            tresp.treatment_response_id AS treatment_response_id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            reduce(result = '', x IN p.race |
              CASE
                WHEN result = '' THEN x
                ELSE result + ';' + x
              END
            ) AS race_str,
            p.sex_at_birth AS sex_at_birth,
            tresp.age_at_response AS age_at_response,
            CASE tresp.age_at_response
              WHEN -999 THEN 'Not Reported'
              ELSE toString(tresp.age_at_response)
            END AS age_at_response_str,
            tresp.response AS response,
            tresp.response_category AS response_category,
            tresp.response_system AS response_system
        page_size: 1000
      - name: "study_properties"
        query: |
          MATCH (tresp:treatment_response)-[:of_treatment_response]->(p:participant)
          WITH tresp, p
          SKIP $skip LIMIT $limit
          MATCH
            (p)-[:of_participant]->(cg:consent_group),
            (cg)-[:of_consent_group]->(stu:study)
          WITH tresp.guid AS id, stu
          RETURN
            id,
            stu.study_id AS study_id,
            stu.dbgap_accession AS dbgap_accession,
            stu.study_phase AS study_phase,
            stu.study_acronym AS study_acronym,
            stu.study_name AS study_name
        page_size: 1000
      - name: "survival_filters"
        query: |
          MATCH (tresp:treatment_response)-[:of_treatment_response]->(p:participant)
          WITH tresp, p
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (sur:survival)-[:of_survival]->(p)
          WITH
            tresp.guid AS id,
            count(sur) AS survival_count,
            [item IN collect(
              DISTINCT {
                last_known_survival_status: sur.last_known_survival_status,
                cause_of_death: sur.cause_of_death,
                first_event: sur.first_event,
                age_at_last_known_survival_status: sur.age_at_last_known_survival_status
              }
            ) WHERE item IS NOT NULL] AS survival_filters
          WITH
            id,
            CASE
              WHEN survival_count > 0 THEN survival_filters
              ELSE []
            END AS survival_filters
          RETURN id, survival_filters
        page_size: 1000
      - name: "treatment_filters"
        query: |
          MATCH (tresp:treatment_response)-[:of_treatment_response]->(p:participant)
          WITH tresp, p
          SKIP $skip LIMIT $limit
          CALL {
            WITH p
            OPTIONAL MATCH (tchemo:treatment_chemotherapy)-[:of_treatment_chemotherapy]->(p)
            WITH
              count(tchemo) AS n_tchemo,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN tchemo.chemotherapy_type IS NULL OR size(tchemo.chemotherapy_type) = 0 THEN ['chemotherapy']
                  ELSE [x IN tchemo.chemotherapy_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: tchemo.chemotherapy_agent,
                age_at_treatment_start: tchemo.age_at_treatment_start,
                age_at_treatment_end: tchemo.age_at_treatment_end
              }) AS collected_filters
            RETURN
              CASE
                WHEN n_tchemo = 0 THEN []
                ELSE collected_filters
              END AS chemo_filters
          }
          CALL {
            WITH p
            OPTIONAL MATCH (trad:treatment_radiation)-[:of_treatment_radiation]->(p)
            WITH
              count(trad) AS n_trad,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN trad.treatment_type IS NULL OR size(trad.treatment_type) = 0 THEN ['radiation']
                  ELSE [x IN trad.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: trad.radiation_therapy_type,
                age_at_treatment_start: trad.age_at_treatment_start,
                age_at_treatment_end: trad.age_at_treatment_end
              }) AS collected_filters
            RETURN
              CASE
                WHEN n_trad = 0 THEN []
                ELSE collected_filters
              END AS rad_filters
          }
          CALL {
            WITH p
            OPTIONAL MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(p)
            WITH
              count(tsurg) AS n_tsurg,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN tsurg.treatment_type IS NULL OR size(tsurg.treatment_type) = 0 THEN ['surgery']
                  ELSE [x IN tsurg.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: tsurg.surgery_type,
                age_at_treatment_start: tsurg.age_at_treatment_start,
                age_at_treatment_end: tsurg.age_at_treatment_end
              }) AS collected_filters
            RETURN
              CASE
                WHEN n_tsurg = 0 THEN []
                ELSE collected_filters
              END AS surg_filters
          }
          CALL {
            WITH p
            OPTIONAL MATCH (toth:treatment_other)-[:of_treatment_other]->(p)
            WITH
              count(toth) AS n_toth,
              collect(DISTINCT {
                treatment_type: CASE
                  WHEN toth.treatment_type IS NULL OR size(toth.treatment_type) = 0 THEN ['other']
                  ELSE [x IN toth.treatment_type WHERE x IS NOT NULL | trim(x)]
                END,
                treatment_agent: toth.other_treatment_type,
                age_at_treatment_start: toth.age_at_treatment_start,
                age_at_treatment_end: toth.age_at_treatment_end
              }) AS collected_filters
            RETURN
              CASE
                WHEN n_toth = 0 THEN []
                ELSE collected_filters
              END AS other_filters
          }
          WITH
            tresp.guid AS id,
            chemo_filters + rad_filters + surg_filters + other_filters AS treatment_filters
          RETURN id, treatment_filters
        page_size: 1000
      - name: "sample_diagnosis_genetic_analysis_file_filters"
        query: |
          MATCH (tresp:treatment_response)-[:of_treatment_response]->(p:participant)
          WITH tresp.guid AS id, p
          SKIP $skip LIMIT $limit

          // Direct participant samples: self-context
          OPTIONAL MATCH (p)<--(s1:sample)
          WITH
            id,
            p,
            collect(DISTINCT { sm: s1, source_sm: s1 }) AS direct_contexts

          // Model-linked samples: p <- Sample_1 <- cell_line/pdx <- Sample_2
          OPTIONAL MATCH (p)<-[:of_sample]-(s1_model:sample)<--(model)<--(s2:sample)
          WHERE model:cell_line OR model:pdx

          WITH
            id,
            p,
            [ctx IN (
              direct_contexts
              + collect(DISTINCT { sm: s1_model, source_sm: s1_model })
              + collect(DISTINCT { sm: s2, source_sm: s2 })
              + collect(DISTINCT { sm: s1_model, source_sm: s2 })
              + collect(DISTINCT { sm: s2, source_sm: s1_model })
            )
            WHERE ctx.sm IS NOT NULL AND ctx.source_sm IS NOT NULL] AS sample_contexts

          WITH
            id,
            p,
            CASE
              WHEN size(sample_contexts) = 0 THEN [{ sm: null, source_sm: null }]
              ELSE sample_contexts
            END AS sample_contexts

          // Study-level files
          OPTIONAL MATCH (st:study)<--(:consent_group)<--(p)
          OPTIONAL MATCH (st)<--(study_file)
          WHERE study_file:clinical_measure_file
          OR study_file:generic_file

          WITH
            id,
            p,
            sample_contexts,
            collect(DISTINCT study_file) AS study_files

          UNWIND sample_contexts AS ctx

          WITH
            id,
            p,
            ctx.sm AS sm,
            ctx.source_sm AS source_sm,
            study_files

          // Source sample-level files
          OPTIONAL MATCH (source_sm)<--(sample_file)
          WHERE sample_file:sequencing_file
          OR sample_file:generic_file
          OR sample_file:methylation_array_file
          OR sample_file:pathology_file
          OR sample_file:cytogenomic_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            collect(DISTINCT sample_file) AS sample_files

          // Participant-level files
          OPTIONAL MATCH (p)<--(participant_file)
          WHERE participant_file:clinical_measure_file
          OR participant_file:generic_file
          OR participant_file:radiology_file

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            collect(DISTINCT participant_file) AS participant_files

          // Source sample-level diagnosis
          OPTIONAL MATCH (source_sm)<--(sample_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            collect(DISTINCT sample_dg) AS sample_diagnoses

          // Participant-level diagnosis
          OPTIONAL MATCH (p)<--(participant_dg:diagnosis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            collect(DISTINCT participant_dg) AS participant_diagnoses

          // Source sample-level genetic analysis
          OPTIONAL MATCH (source_sm)<--(sample_ga:genetic_analysis)

          WITH
            id,
            p,
            sm,
            source_sm,
            study_files,
            sample_files,
            participant_files,
            sample_diagnoses,
            participant_diagnoses,
            collect(DISTINCT sample_ga) AS sample_gas

          // Participant-level genetic analysis
          OPTIONAL MATCH (p)<--(participant_ga:genetic_analysis)

          WITH
            id,
            sm,
            sample_files + participant_files + study_files AS files,
            sample_diagnoses + participant_diagnoses AS diagnoses,
            sample_gas + collect(DISTINCT participant_ga) AS gas

          UNWIND CASE WHEN size(files) = 0 THEN [null] ELSE files END AS file
          UNWIND CASE WHEN size(diagnoses) = 0 THEN [null] ELSE diagnoses END AS dg
          UNWIND CASE WHEN size(gas) = 0 THEN [null] ELSE gas END AS ga

          WITH
            id,
            collect(DISTINCT {
              sm: sm,
              file: file,
              dg: dg,
              ga: ga
            }) AS rows

          UNWIND rows AS row
          WITH DISTINCT
            id,

          // Sample facets
            row.sm.anatomic_site AS sample_anatomic_site,
            row.sm.participant_age_at_collection AS participant_age_at_collection,
            row.sm.sample_tumor_status AS sample_tumor_status,
            row.sm.tumor_spatial_extent AS tumor_spatial_extent,

          // Diagnosis facets
            row.dg.age_at_diagnosis AS age_at_diagnosis,
            row.dg.anatomic_site AS diagnosis_anatomic_site,
            row.dg.disease_phase AS disease_phase,
            row.dg.diagnosis_classification_system AS diagnosis_classification_system,
            row.dg.diagnosis_category AS diagnosis_category,
            row.dg.diagnosis_basis AS diagnosis_basis,
            row.dg.diagnosis AS diagnosis,

          // Genetic Analysis facets
            row.ga.reported_significance AS reported_significance,
            row.ga.reported_significance_system AS reported_significance_system,
            row.ga.gene_symbol AS gene_symbol,
            row.ga.alteration AS alteration,
            row.ga.fusion_partner_gene AS fusion_partner_gene,
            row.ga.alteration_type AS alteration_type,
            row.ga.status AS status,

          // File facets
            row.file.data_category AS data_category,
            row.file.file_type AS file_type,
            row.file.file_mapping_level AS file_mapping_level,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_selection
              ELSE null
            END AS library_selection,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_material
              ELSE null
            END AS library_source_material,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_source_molecule
              ELSE null
            END AS library_source_molecule,
            CASE
              WHEN row.file IS NOT NULL
              AND size(labels(row.file)) > 0
              AND labels(row.file)[0] = 'sequencing_file'
              THEN row.file.library_strategy
              ELSE null
            END AS library_strategy
          RETURN
            id,
            collect({
              sample_anatomic_site: sample_anatomic_site,
              participant_age_at_collection: participant_age_at_collection,
              sample_tumor_status: sample_tumor_status,
              tumor_spatial_extent: tumor_spatial_extent,
              age_at_diagnosis: age_at_diagnosis,
              diagnosis_anatomic_site: diagnosis_anatomic_site,
              disease_phase: disease_phase,
              diagnosis_classification_system: diagnosis_classification_system,
              diagnosis_category: diagnosis_category,
              diagnosis_basis: diagnosis_basis,
              diagnosis: diagnosis,
              reported_significance: reported_significance,
              reported_significance_system: reported_significance_system,
              gene_symbol: gene_symbol,
              alteration: alteration,
              fusion_partner_gene: fusion_partner_gene,
              alteration_type: alteration_type,
              status: status,
              data_category: data_category,
              file_type: file_type,
              file_mapping_level: file_mapping_level,
              library_selection: library_selection,
              library_source_material: library_source_material,
              library_source_molecule: library_source_molecule,
              library_strategy: library_strategy
            }) AS sample_diagnosis_genetic_analysis_file_filters
        page_size: 1000

  - index_name: diagnoses_table
    id_field: "id"
    mapping:
      keyword:
        - id
        - diagnosis_id
        - pid
        - participant_id
        - race
        - sex_at_birth
        - dbgap_accession
        - study_phase
        - study_id
        - study_acronym
        - study_name
        - diagnosis
        - diagnosis_category
        - diagnosis_category_str
        - diagnosis_anatomic_site
        - diagnosis_anatomic_site_str
        - diagnosis_classification_system
        - diagnosis_classification_system_str
        - diagnosis_basis
        - diagnosis_basis_str
        - diagnosis_comment
        - disease_phase
        - tumor_spatial_extent
        - toronto_childhood_cancer_staging
        - tumor_grade
        - tumor_stage_clinical_m
        - tumor_stage_clinical_n
        - tumor_stage_clinical_t
        - survival_filters.last_known_survival_status
        - survival_filters.cause_of_death
        - survival_filters.first_event
        - treatment_filters.treatment_type
        - treatment_filters.treatment_agent
        - treatment_response_filters.response
        - treatment_response_filters.response_category
        - treatment_response_filters.response_system
        - sample_genetic_analysis_file_filters.sample_anatomic_site
        - sample_genetic_analysis_file_filters.sample_tumor_status
        - sample_genetic_analysis_file_filters.tumor_spatial_extent
        - sample_genetic_analysis_file_filters.reported_significance
        - sample_genetic_analysis_file_filters.reported_significance_system
        - sample_genetic_analysis_file_filters.gene_symbol
        - sample_genetic_analysis_file_filters.alteration
        - sample_genetic_analysis_file_filters.fusion_partner_gene
        - sample_genetic_analysis_file_filters.alteration_type
        - sample_genetic_analysis_file_filters.status
        - sample_genetic_analysis_file_filters.data_category
        - sample_genetic_analysis_file_filters.file_type
        - sample_genetic_analysis_file_filters.file_mapping_level
        - sample_genetic_analysis_file_filters.library_selection
        - sample_genetic_analysis_file_filters.library_source_material
        - sample_genetic_analysis_file_filters.library_source_molecule
        - sample_genetic_analysis_file_filters.library_strategy
      integer:
        - age_at_diagnosis
        - survival_filters.age_at_last_known_survival_status
        - treatment_filters.age_at_treatment_start
        - treatment_filters.age_at_treatment_end
        - treatment_response_filters.age_at_response
        - sample_genetic_analysis_file_filters.participant_age_at_collection
    # Cypher query will be used to retrieve data from Neo4j, and index into Elasticsearch
    initial_query:
      query: |
        MATCH (dg:diagnosis)
        WITH dg
        SKIP $skip LIMIT $limit
        RETURN dg.guid AS id
      page_size: 1000
    update_queries:
      - name: "diagnosis_properties"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit
          RETURN
            dg.guid AS id,
            dg.diagnosis_id AS diagnosis_id,
            dg.diagnosis AS diagnosis,
            dg.diagnosis_category AS diagnosis_category,
            reduce(
              c = '',
              category IN coalesce(dg.diagnosis_category, []) |
                CASE
                  WHEN c = '' THEN category
                  ELSE c + ';' + category
                END
            ) AS diagnosis_category_str,
            dg.age_at_diagnosis AS age_at_diagnosis,
            dg.anatomic_site AS diagnosis_anatomic_site,
            reduce(
              s = '',
              site IN coalesce(dg.anatomic_site, []) |
                CASE
                  WHEN s = '' THEN site
                  ELSE s + ';' + site
                END
            ) AS diagnosis_anatomic_site_str,
            dg.diagnosis_classification_system AS diagnosis_classification_system,
            reduce(
              s = '',
              system IN coalesce(dg.diagnosis_classification_system, []) |
                CASE
                  WHEN s = '' THEN system
                  ELSE s + ';' + system
                END
            ) AS diagnosis_classification_system_str,
            dg.diagnosis_basis AS diagnosis_basis,
            reduce(
              b = '',
              basis IN coalesce(dg.diagnosis_basis, []) |
                CASE
                  WHEN b = '' THEN basis
                  ELSE b + ';' + basis
                END
            ) AS diagnosis_basis_str,
            dg.diagnosis_comment AS diagnosis_comment,
            dg.disease_phase AS disease_phase,
            dg.tumor_spatial_extent AS tumor_spatial_extent,
            dg.toronto_childhood_cancer_staging AS toronto_childhood_cancer_staging,
            dg.tumor_grade AS tumor_grade,
            dg.tumor_stage_clinical_m AS tumor_stage_clinical_m,
            dg.tumor_stage_clinical_n AS tumor_stage_clinical_n,
            dg.tumor_stage_clinical_t AS tumor_stage_clinical_t
        page_size: 1000
      - name: "participant_properties"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (dg)-[*..4]->(p:participant)
          RETURN
            dg.guid AS id,
            p.guid AS pid,
            p.participant_id AS participant_id,
            p.race AS race,
            p.sex_at_birth AS sex_at_birth
        page_size: 1000
      - name: "study_properties"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (dg)-[*..7]->(st:study)
          RETURN
            dg.guid AS id,
            st.study_id AS study_id,
            st.dbgap_accession AS dbgap_accession,
            st.study_phase AS study_phase,
            st.study_acronym AS study_acronym,
            st.study_name AS study_name
        page_size: 1000
      - name: "survival_filters"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (dg)-[*..4]->(:participant)<-[:of_survival]-(su:survival)
          WITH
            dg.guid AS id,
            count(su) AS su_count,
            [item IN collect(DISTINCT {
              last_known_survival_status: su.last_known_survival_status,
              cause_of_death: su.cause_of_death,
              first_event: su.first_event,
              age_at_last_known_survival_status: su.age_at_last_known_survival_status
            }) WHERE item.last_known_survival_status IS NOT NULL OR item.cause_of_death IS NOT NULL OR item.first_event IS NOT NULL OR item.age_at_last_known_survival_status IS NOT NULL] AS survival_filters
          WITH id, CASE WHEN su_count > 0 THEN survival_filters ELSE [] END AS survival_filters
          RETURN id, survival_filters
        page_size: 1000
      - name: "treatment_filters"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit

          OPTIONAL MATCH (dg)-[*..4]->(p:participant)

          OPTIONAL MATCH (p)<-[:of_treatment_chemotherapy]-(tchemo:treatment_chemotherapy)
          WITH dg, p, COLLECT(DISTINCT {
            treatment_type: tchemo.chemotherapy_type,
            treatment_agent: tchemo.chemotherapy_agent,
            age_at_treatment_start: tchemo.age_at_treatment_start,
            age_at_treatment_end: tchemo.age_at_treatment_end
          }) AS chemo_filters

          OPTIONAL MATCH (p)<-[:of_treatment_radiation]-(trad:treatment_radiation)
          WITH dg, p, chemo_filters, COLLECT(DISTINCT {
            treatment_type: trad.treatment_type,
            treatment_agent: trad.radiation_therapy_type,
            age_at_treatment_start: trad.age_at_treatment_start,
            age_at_treatment_end: trad.age_at_treatment_end
          }) AS radiation_filters

          OPTIONAL MATCH (p)<-[:of_treatment_surgery]-(tsurg:treatment_surgery)
          WITH dg, p, chemo_filters, radiation_filters, COLLECT(DISTINCT {
            treatment_type: tsurg.treatment_type,
            treatment_agent: tsurg.surgery_type,
            age_at_treatment_start: tsurg.age_at_treatment_start,
            age_at_treatment_end: tsurg.age_at_treatment_end
          }) AS surgery_filters

          OPTIONAL MATCH (p)<-[:of_treatment_other]-(toth:treatment_other)
          WITH dg,
              chemo_filters + radiation_filters + surgery_filters + COLLECT(DISTINCT {
                treatment_type: toth.treatment_type,
                treatment_agent: toth.other_treatment_type,
                age_at_treatment_start: toth.age_at_treatment_start,
                age_at_treatment_end: toth.age_at_treatment_end
              }) AS raw_treatment_filters

          UNWIND raw_treatment_filters AS f

          WITH dg, COLLECT(DISTINCT f) AS deduped_treatment_filters

          WITH dg.guid AS id,
              [
                f IN deduped_treatment_filters
                WHERE f.treatment_type IS NOT NULL
                    OR f.treatment_agent IS NOT NULL
                    OR f.age_at_treatment_start IS NOT NULL
                    OR f.age_at_treatment_end IS NOT NULL
              ] AS treatment_filters

          RETURN id, treatment_filters
        page_size: 1000
      - name: "treatment_response_filters"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit
          OPTIONAL MATCH (dg)-[*..4]->(:participant)<-[:of_treatment_response]-(tresp:treatment_response)
          WITH
            dg.guid AS id,
            count(tresp) AS tresp_count,
            [item IN collect(DISTINCT {
              age_at_response: tresp.age_at_response,
              response: tresp.response,
              response_category: tresp.response_category,
              response_system: tresp.response_system
            }) WHERE item.response IS NOT NULL OR item.age_at_response IS NOT NULL OR item.response_category IS NOT NULL OR item.response_system IS NOT NULL] AS treatment_response_filters
          WITH id, CASE WHEN tresp_count > 0 THEN treatment_response_filters ELSE [] END AS treatment_response_filters
          RETURN id, treatment_response_filters
        page_size: 1000
      - name: "sample_genetic_analysis_file_filters"
        query: |
          MATCH (dg:diagnosis)
          WITH dg
          SKIP $skip LIMIT $limit

          CALL {
            WITH dg

            // Case 1: dg -> sample_1 -> participant
            // Also include related sample_2 -> model -> sample_1 contexts
            OPTIONAL MATCH (dg)-->(s1:sample)-->(p1:participant)

            WITH dg, s1, p1,
                collect(DISTINCT {sm: s1, source_sm: s1, p: p1}) AS direct_contexts

            OPTIONAL MATCH (s2:sample)-->(model)-->(s1)
            WHERE model:cell_line OR model:pdx

            WITH direct_contexts
              + collect(DISTINCT {sm: s1, source_sm: s2, p: p1})
              + collect(DISTINCT {sm: s2, source_sm: s2, p: p1})
              + collect(DISTINCT {sm: s2, source_sm: s1, p: p1}) AS contexts

            UNWIND contexts AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p

            UNION

            WITH dg

            // Case 2: dg -> sample_2 -> model -> sample_1 -> participant
            OPTIONAL MATCH (dg)-->(s2:sample)-->(model)-->(s1:sample)-->(p2:participant)
            WHERE model:cell_line OR model:pdx

            WITH s1, s2, p2
            UNWIND [
              {sm: s1, source_sm: s1, p: p2},
              {sm: s1, source_sm: s2, p: p2},
              {sm: s2, source_sm: s2, p: p2},
              {sm: s2, source_sm: s1, p: p2}
            ] AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p

            UNION

            WITH dg

            // Case 3: dg -> sample -> model -> study
            OPTIONAL MATCH (dg)-->(s3:sample)-->(model)-->(st:study)
            WHERE model:cell_line OR model:pdx

            RETURN s3 AS sm, s3 AS source_sm, null AS p

            UNION

            WITH dg

            // Case 4: dg -> participant, then expand all sample contexts under participant
            OPTIONAL MATCH (dg)-->(p4:participant)

            OPTIONAL MATCH (p4)<--(direct_sm:sample)
            WITH dg, p4,
                collect(DISTINCT {sm: direct_sm, source_sm: direct_sm, p: p4}) AS direct_contexts

            OPTIONAL MATCH (p4)<-[:of_sample]-(s1_model:sample)<--(model)<--(s2_model:sample)
            WHERE model:cell_line OR model:pdx

            WITH direct_contexts
              + collect(DISTINCT {sm: s1_model, source_sm: s1_model, p: p4})
              + collect(DISTINCT {sm: s1_model, source_sm: s2_model, p: p4})
              + collect(DISTINCT {sm: s2_model, source_sm: s2_model, p: p4})
              + collect(DISTINCT {sm: s2_model, source_sm: s1_model, p: p4}) AS contexts

            UNWIND contexts AS ctx

            RETURN
              ctx.sm AS sm,
              ctx.source_sm AS source_sm,
              ctx.p AS p
          }

          WITH dg, sm, source_sm, p
          WHERE sm IS NOT NULL OR p IS NOT NULL

          // Sample-level files
          OPTIONAL MATCH (source_sm)<--(sample_file)
          WHERE sample_file:sequencing_file
            OR sample_file:generic_file
            OR sample_file:methylation_array_file
            OR sample_file:pathology_file
            OR sample_file:cytogenomic_file

          WITH dg, sm, source_sm, p,
              collect(DISTINCT sample_file) AS sample_files

          // Participant-level files
          OPTIONAL MATCH (p)<--(participant_file)
          WHERE participant_file:clinical_measure_file
            OR participant_file:generic_file
            OR participant_file:radiology_file

          WITH dg, sm, source_sm, p,
              sample_files,
              collect(DISTINCT participant_file) AS participant_files

          // Sample-level genetic analysis
          OPTIONAL MATCH (source_sm)<--(sample_ga:genetic_analysis)

          WITH dg, sm, p,
              sample_files,
              participant_files,
              collect(DISTINCT sample_ga) AS sample_gas

          // Participant-level genetic analysis
          OPTIONAL MATCH (p)<--(participant_ga:genetic_analysis)

          WITH dg, sm,
              sample_files + participant_files AS files,
              sample_gas + collect(DISTINCT participant_ga) AS gas

          UNWIND CASE WHEN size(files) = 0 THEN [null] ELSE files END AS file
          UNWIND CASE WHEN size(gas) = 0 THEN [null] ELSE gas END AS ga

          WITH DISTINCT
            dg.guid AS id,

            sm.anatomic_site AS sample_anatomic_site,
            sm.participant_age_at_collection AS participant_age_at_collection,
            sm.sample_tumor_status AS sample_tumor_status,
            sm.tumor_spatial_extent AS tumor_spatial_extent,

            ga.reported_significance AS reported_significance,
            ga.reported_significance_system AS reported_significance_system,
            ga.gene_symbol AS gene_symbol,
            ga.alteration AS alteration,
            ga.fusion_partner_gene AS fusion_partner_gene,
            ga.alteration_type AS alteration_type,
            ga.status AS status,

            file.data_category AS data_category,
            file.file_type AS file_type,
            file.file_mapping_level AS file_mapping_level,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_selection ELSE null END AS library_selection,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_source_material ELSE null END AS library_source_material,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_source_molecule ELSE null END AS library_source_molecule,

            CASE WHEN file IS NOT NULL AND file:sequencing_file
                THEN file.library_strategy ELSE null END AS library_strategy

          WITH id,
              collect(DISTINCT {
                sample_anatomic_site: sample_anatomic_site,
                participant_age_at_collection: participant_age_at_collection,
                sample_tumor_status: sample_tumor_status,
                tumor_spatial_extent: tumor_spatial_extent,

                reported_significance: reported_significance,
                reported_significance_system: reported_significance_system,
                gene_symbol: gene_symbol,
                alteration: alteration,
                fusion_partner_gene: fusion_partner_gene,
                alteration_type: alteration_type,
                status: status,

                data_category: data_category,
                file_type: file_type,
                file_mapping_level: file_mapping_level,
                library_selection: library_selection,
                library_source_material: library_source_material,
                library_source_molecule: library_source_molecule,
                library_strategy: library_strategy
              }) AS raw_filters

          RETURN
            id,
            [
              f IN raw_filters
              WHERE f.sample_anatomic_site IS NOT NULL
                OR f.participant_age_at_collection IS NOT NULL
                OR f.sample_tumor_status IS NOT NULL
                OR f.tumor_spatial_extent IS NOT NULL
                OR f.file_type IS NOT NULL
            ] AS sample_genetic_analysis_file_filters
        page_size: 500

