          RETURN 'treatment_radiation:' + trad.guid AS id

          UNION

          MATCH (tsurg:treatment_surgery)-[:of_treatment_surgery]->(:participant)
          RETURN 'treatment_surgery:' + tsurg.guid AS id

          UNION

          MATCH (toth:treatment_other)-[:of_treatment_other]->(:participant)
